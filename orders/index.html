<style>

:root{--bg:#1E1C18;--panel:#26221C;--panel-2:#2E2A22;--text:#EFE8D8;--muted:#9C9280;--amber:#E3A23A;--amber-dim:#3B2E1A;--line:#433D32;--green:#5FA76E;--green-dim:#1F3325;--rust:#C46A4A;--rust-dim:#3A231B;
  --font-b:"Inter",system-ui,-apple-system,sans-serif;--font-m:"Space Grotesk","Inter",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:calc(14px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:8px}
.brand .t{font-family:var(--font-m);font-weight:600;font-size:18px}
.brand .s{font-size:12px;color:var(--muted)}
h2{font-family:var(--font-m);font-weight:600;font-size:17px;margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--amber-dim);color:var(--amber);font-size:12px;font-weight:600;margin-right:8px;vertical-align:1px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.seg button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px 10px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{border-color:var(--amber);background:var(--amber-dim);color:var(--amber)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 11px;font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber)}
textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text);text-decoration:none}
.btn-primary{background:var(--amber);border-color:var(--amber);color:#1E1C18}
.btn-sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--amber);background:var(--amber-dim)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{color:var(--amber);border-color:var(--amber)}
.status{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px}
.bar{height:4px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .2s}
.lines{display:grid;gap:10px}
.line{background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px}
.line.ok{border-left-color:var(--green)}
.line.check{border-left-color:var(--amber)}
.line.new{border-left-color:#6FA0C8}
.line.skip{opacity:.55}
.line .src{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);word-break:break-word;margin-bottom:6px}
.line .lrow{display:grid;grid-template-columns:1fr 92px 34px;gap:8px;align-items:center}
.line .unit{font-size:12px;color:var(--muted)}

.line .newf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

.tag{font-size:11px;border-radius:99px;padding:2px 8px;margin-left:6px}
.tag.ok{background:var(--green-dim);color:var(--green)}.tag.check{background:var(--amber-dim);color:var(--amber)}.tag.new{background:#1C2A36;color:#8FB9DB}

.hist{list-style:none;margin:0;padding:0}
.hist li{border-top:1px solid var(--line);padding:9px 0;font-size:13px}

.empty{padding:14px;text-align:center;color:var(--muted);font-size:13px}
.hide{display:none!important}

table.ol td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}

table.ol tr.out td.n.o{color:var(--amber);font-weight:600}

.alert{border-color:var(--rust)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.backlink{background:none;border:none;color:var(--amber);font:inherit;cursor:pointer;padding:0;margin-bottom:10px}
.line .lrow.r{grid-template-columns:1fr 92px 34px}
.sub{font-size:12px;color:var(--muted);margin-top:4px}

.mbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.tick{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--text)}.tick input{width:20px;height:20px;accent-color:var(--amber)}
.ccbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px}

.ccmain{background:var(--amber-dim);color:var(--amber);border-radius:99px;padding:5px 10px;font-size:13px;white-space:nowrap}
.check{border:1px solid var(--amber);background:var(--amber-dim);border-radius:10px;padding:12px}

.sup .supgrid{display:grid;gap:3px;font-size:13px;margin-top:6px}.ord.sup{cursor:default}.ord.sup.thin{border-left-color:var(--amber)}
#sf_address{font:inherit;height:64px;min-height:0;resize:vertical}

.cardimg{width:100%;max-height:180px;object-fit:contain;border-radius:8px;border:1px solid var(--line);margin-bottom:8px;background:#000}

.po-items th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8a8060;border-bottom:1px solid #B9AF93;padding:4px 6px}
.po-items td{border-bottom:1px dotted #C9BFA5;padding:3px 6px;line-height:1.3;vertical-align:top}.po-items td.n,.po-items th.n{text-align:center;width:50px}.po-items td:first-child{width:28px;color:#8a7f63}
.po-size{color:#8a7f63;font-size:12.5px}
.po-bottom{margin-top:auto;padding-top:10px}
.po-notes{font-size:13px;margin-bottom:8px}.po-quote{font-size:13px;border-top:1px solid #B9AF93;padding-top:10px}

.po-lab{font-family:var(--font-m);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#5A5238;margin-top:5px}.po-when{font-family:var(--font-m);font-size:10px;color:#8a7f63;margin-top:2px}

/* Oak Joinery — Stock In helpers (pure functions, no Firebase/DOM).
 * Turns pasted text, Excel rows, PDF text and OCR text into lines
 * {code, desc, size, job, material, notes, qty, qtyL, text}, and matches
 * each line to an item in Board Stock, Consumables or Stock List.
 * Loaded by stock-in/index.html; also require()-able in node for tests. */
(function (global) {
  "use strict";

  // ---------- text helpers ----------
  function norm(s) {
    return String(s == null ? "" : s).toLowerCase()
      .replace(/[×]/g, "x")
      .replace(/(\d)\s*x\s*(\d)/g, "$1x$2")
      .replace(/(\d),(\d{3})\b/g, "$1$2")
      .replace(/[^a-z0-9.x]+/g, " ")
      .replace(/\s+/g, " ").trim();
  }
  var SYN = {
    supawood: "mdf", mdf: "mdf", "m.d.f": "mdf",
    chipboard: "chip", particleboard: "chip", pb: "chip", chip: "chip",
    melamine: "mel", mel: "mel", mfc: "mel", mf: "mel",
    wht: "white", wh: "white", blk: "black",
    ply: "plywood", plywood: "plywood",
    pr: "pair", prs: "pair", pairs: "pair",
    pk: "pack", pkt: "pack", pkts: "pack", packs: "pack",
    ltr: "l", ltrs: "l", litre: "l", litres: "l", liter: "l", liters: "l",
    screws: "screw", hinges: "hinge", runners: "runner", handles: "handle"
  };
  // Board sheet sizes in mm → the ft names used in Board Stock ("9x6").
  var SHEET = { "2750x1830": "9x6", "2745x1830": "9x6", "2800x1830": "9x6", "2440x1220": "8x4", "2440x1830": "8x6", "3660x1830": "12x6", "3050x1830": "10x6", "1830x2750": "9x6", "1830x3660": "12x6" };
  function tokens(s) {
    var out = [];
    norm(s).split(" ").forEach(function (t) {
      if (!t) return;
      if (SHEET[t]) { out.push(SHEET[t]); return; }
      var m = t.match(/^(\d+(?:\.\d+)?)(mm|m|l|ml|kg|g|x)$/);
      if (m) { out.push(m[1]); if (m[2] !== "x") out.push(m[2]); return; }
      if (SYN[t]) { out.push(SYN[t]); return; }
      out.push(t);
    });
    return out;
  }
  function isNum(t) { return /^\d+(\.\d+)?$/.test(t); }

  var STOP = /\b(business park|industrial park|exporters|street|avenue|road|drive|postnet|p\.?\s?o\.? box|private bag|suite \d|sales code|sales rep|salesperson|lead time|expires|valid until|att\b|attention|account no|branch code|swift|reference|ref no|your ref|customer no|cust no|order date|printed|telephone|phone|cell|mobile|fax|reg\.? no|co reg|total|sub ?total|vat|tax|invoice|tel|fax|page|bank|account|acc no|branch|email|e-mail|www|http|reg no|registration|balance|amount due|terms|signature|signed|received by|driver|deliver to|delivery address|order no|date|customer|vat no|thank you|delivery note|credit note|quotation|quote no|purchase order|po no|p\/o)\b/i;

  // Header words → field
  var HEAD = {
    code: ["code", "item code", "product code", "stock code", "sku", "part no", "part number", "item no", "article", "ref", "board code"],
    desc: ["description", "item", "product", "desc", "item description", "product description", "details", "name", "board"],
    qty: ["qty", "quantity", "qty delivered", "qty supplied", "delivered", "supplied", "qty shipped", "units", "qty r", "qty right", "count", "qty ordered"],
    qtyL: ["qty l", "qty left", "left"],
    size: ["size", "dimensions", "dimension"],
    job: ["job", "category", "cat", "category / job"],
    material: ["material"],
    notes: ["notes", "note", "comment", "comments"]
  };
  function headField(h) {
    var n = String(h || "").trim().toLowerCase().replace(/[:.]/g, "").replace(/\s+/g, " ");
    for (var f in HEAD) if (HEAD[f].indexOf(n) >= 0) return f;
    return null;
  }

  function toQty(v) {
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return isFinite(v) ? v : null;
    var s = String(v).trim().replace(/\s/g, "").replace(/,(\d{1,2})$/, ".$1").replace(/,/g, "");
    var m = s.match(/^-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }

  // ---------- table rows (Excel / pasted tab-separated) ----------

function targetOf(stock){ return !stock ? "" : (stock.indexOf("b:") === 0 || stock === "new:board") ? "board" : (stock.indexOf("c:") === 0 || stock === "new:cons") ? "consumables" : ""; }
function stockLabel(line){

// Consumables counted in packs (e.g. screws per 500) can be ordered per pack or per single item.
function packSizeOf(line){
  var stock = line && line.stock;
  if(stock === "new:cons") return (line.nf && line.nf.unit === "per500") ? (parseInt(line.nf.bundle) || 500) : 0;
  if(!stock || stock.indexOf("c:s:") !== 0) return 0;

// Match a supplier line to a stock item in either app. Best of the two wins.
function matchStock(src, codeUnique){

    var target = p[0], its = p[1].map(function(i){ return { id:i.id, code:"", desc:i.desc, size:i.size, text:i.text }; });

function setStatus(msg, pct){ statusMsg = msg; if(pct !== undefined) progress = pct; var s = document.getElementById("status"); if(s) s.textContent = msg; var b = document.getElementById("barI"); if(b) b.style.width = Math.round((progress||0)*100) + "%"; }
function loadScript(src){ return new Promise(function(res, rej){ var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error("Could not load " + src)); }; document.head.appendChild(s); }); }
async function pdfLib(){
  if(!window.pdfjsLib){ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); }
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

var ocrWorker = null;
async function ocr(canvasOrImg, label){
  if(!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  if(!ocrWorker){
    setStatus("Getting the text reader ready (first time only)…", 0.05);

    });

function imageToCanvas(file){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 2200, sc = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas"); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      var g = c.getContext("2d"); g.filter = "grayscale(1) contrast(1.25)"; g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("That picture couldn't be opened.")); };
    img.src = url;
  });
}
// Returns the lines found in a PDF / photo / Excel file (same reader as Stock In).
var docText = "";
async function readDoc(file){
  var name = file.name || "file", lower = name.toLowerCase();
  docText = "";
  if(/\.(xlsx|xls|xlsm|csv)$/.test(lower)){
    setStatus("Reading " + name + "…", 0.3);
    var wb = XLSX.read(await file.arrayBuffer(), { type:"array" }), raw = [];
    wb.SheetNames.forEach(function(sn){
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:"", raw:true });
      var t = L.linesFromTable(rows);
      docText += rows.map(function(r){ return r.join("  "); }).join("\n") + "\n";
      raw = raw.concat(t || L.linesFromText(rows.map(function(r){ return r.join("  "); }).join("\n")));
    });
    return raw;
  }
  if(/\.pdf$/.test(lower) || file.type === "application/pdf"){
    setStatus("Opening PDF…", 0.1);
    var pdfjs = await pdfLib();
    var pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
    var text = "", table = [];
    for(var p = 1; p <= Math.min(pdf.numPages, 10); p++){
      var page = await pdf.getPage(p), tc = await page.getTextContent();
      text += L.pdfItemsToText(tc.items) + "\n";
      table = table.concat(L.pdfTable(tc.items));
    }
    if(text.replace(/\s/g, "").length < 40){
      text = "";
      for(var q = 1; q <= Math.min(pdf.numPages, 5); q++){
        var pg = await pdf.getPage(q), vp = pg.getViewport({ scale: 2.2 });
        var c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
        await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        text += await ocr(c, "page " + q) + "\n";
      }
    }
    docText = text;
    return table.length ? table : L.linesFromDoc(text);
  }
  if(/^image\//.test(file.type) || /\.(jpe?g|png|heic|webp)$/.test(lower)){
    docText = await ocr(await imageToCanvas(file), "photo");
    return L.linesFromDoc(docText);
  }
  throw new Error("That file type isn't supported. Use a PDF, photo, Excel or CSV file.");
}

// ---------- reading the supplier and document number off a quote / delivery note ----------
var SUP_STOP = { pty:1, ltd:1, limited:1, cc:1, the:1, and:1, sa:1, south:1, africa:1, co:1, company:1, inc:1, ta:1, of:1, group:1, holdings:1, trading:0 };
function plain(t){ return " " + String(t || "").toLowerCase().replace(/[^a-z0-9@.]+/g, " ").replace(/\s+/g, " ") + " "; }
function supKeys(name){ return plain(name).trim().split(" ").filter(function(w){ return w.length >= 3 && !SUP_STOP[w] && !/^\d+$/.test(w); }); }
function isUs(t){ return /oak\s*joinery/i.test(t || ""); }
// Best known supplier named in the text (by email domain or by the words of its name).
function detectSupplier(text, cands){
  var T = plain(text), best = null, bs = 0;
  (cands || []).forEach(function(c){
    if(!c || !c.name || isUs(c.name)) return;
    var sc = 0, dom = String(c.email || "").toLowerCase().split("@")[1];
    if(dom && dom.length > 4 && T.indexOf(dom) >= 0) sc = 1;
    else {
      var k = supKeys(c.name); if(!k.length) return;
      var hits = k.filter(function(w){ return T.indexOf(" " + w + " ") >= 0; }).length;
      if(hits === k.length) sc = 0.9 + Math.min(k.length, 5) / 100;
      else if(hits >= 2 && hits / k.length >= 0.6) sc = 0.6 + hits / 100;
    }
    if(sc > bs){ bs = sc; best = c; }
  });
  return bs >= 0.6 ? best : null;
}
// A company name printed near the top that isn't us, e.g. "Jamac Technological Industries CC".
function guessSupplierName(text){
  var lines = String(text || "").split(/\n/).slice(0, 25);
  for(var i = 0; i < lines.length; i++){
    var ln = lines[i].replace(/\s{2,}.*$/, "").trim();
    if(!ln || isUs(ln)) continue;
    var m = ln.match(/^(.{2,60}?\b(?:\(pty\)\s*ltd|pty\s*ltd|\(pty\)|limited|ltd|cc))\b/i);
    if(m && !/\b(bank|account|reg|vat|invoice|quot)/i.test(m[1])) return m[1].replace(/\s+/g, " ").trim();
  }
  return "";
}
function guessEmail(text){
  var all = String(text || "").match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g) || [];
  return all.find(function(e){ return !/oakjoinery/i.test(e); }) || "";
}
function detectRef(text, kind){
  var t = String(text || "");
  var pats = kind === "quote"
    ? [/\b(?:quot(?:e|ation)|qte|quo)\s*(?:no\.?|number|nr|#)?\s*[:\-]?\s*([A-Z]{0,5}[-\/]?\d[\w\-\/]{2,})/i, /\b((?:QU|QUO|QTE|SOQ)[-\s]?\d{3,}[\w-]*)\b/]
    : [/\b(?:delivery\s*note|d\/n|tax\s*invoice|invoice|inv)\s*(?:no\.?|number|nr|#)?\s*[:\-]?\s*([A-Z]{0,5}[-\/]?\d[\w\-\/]{2,})/i, /\b((?:IN|INV|DN|SO)[-\s]?\d{4,}[\w-]*)\b/];
  pats = pats.concat([/\bdocument\s*(?:no\.?|number|nr|#)\s*[:\-]?\s*([A-Z]{0,5}[-\/]?\d[\w\-\/]{2,})/i]);
  for(var i = 0; i < pats.length; i++){ var m = t.match(pats[i]); if(m && m[1] && !/^\d{1,3}$/.test(m[1])) return m[1].replace(/\s+/g, "").slice(0, 30); }
  return "";
}

function openLinesFor(supplier, onlyId){
  var key = String(supplier||"").trim().toLowerCase(), out = [], loc = rcv ? rcv.location : "";
  ordersArr().filter(function(o){ return isOpen(o) && (onlyId ? o.id === onlyId : (String(o.supplier||"").trim().toLowerCase() === key && atLoc(o, loc))); })
    .sort(function(a,b){ return String(a.orderedDate).localeCompare(String(b.orderedDate)); })
    .forEach(function(o){ orderLines(o).forEach(function(l){ if(outstanding(l) > 0) out.push({ id:o.id + "|" + l.lid, oid:o.id, lid:l.lid, order:o, line:l,
      label:(l.desc || l.text || stockLabel(l)).slice(0, 70) + " — " + outstanding(l) + " " + unitOf(l) + " to come" + (o.ref ? " (" + o.ref + ")" : ""),
      code:l.code || "", desc:l.desc || "", size:l.size || "", text:[l.code, l.desc || l.text, l.size, stockLabel(l)].join(" ") }); }); });
  return out;
}
function startReceive(supplier, orderId){
  var o = orderId ? D.orders[orderId] : null;
  rcv = { supplier: o ? o.supplier : (supplier || ""), orderId: orderId || null, location: (o && o.location) || ui.loc || locationsAll()[0], docRef:"", file:null, lines:[] };
  ui.view = "receive"; render(); window.scrollTo(0, 0);

function addRcvLines(raw, source){
  if(!raw.length){ toast("No lines with a quantity found in that " + source + ".", "err"); return; }
  var cands = openLinesFor(rcv.supplier, rcv.orderId);
  var its = cands.map(function(c){ return { id:c.id, code:c.code, desc:c.desc, size:c.size, text:c.text }; });
  var cc = {}; raw.forEach(function(l){ var c = L.norm(l.code); if(c) cc[c] = (cc[c]||0) + 1; });
  var got = 0;
  raw.forEach(function(l){
    var m = L.matchLine(l, its, {}, {});
    var match = m.itemId || "", how = m.how, score = m.score;
    if(!match){
      // compare the wording and sizes with each open order line (prices and quantities ignored)
      var best = null, bs = 0, second = 0;
      cands.forEach(function(c){ var sc = rcvScore(l, c.line); if(sc > bs){ second = bs; bs = sc; best = c; } else if(sc > second) second = sc; });
      if(best && bs >= 0.6 && (bs - second > 0.05 || cands.length === 1)){ match = best.id; how = "fuzzy"; score = bs >= 0.9 ? 0.9 : bs; }
    }
    if(!match){

// Something was received that wasn't on the delivery note: take it back off the order and out of stock.
function fixDeliveryModal(o, did){
  var d = o.deliveries && o.deliveries[did]; if(!d) return;
  var rows = Object.keys(d.lines || {}).filter(function(k){ return d.lines[k]; }).map(function(k){ return Object.assign({ i:k }, d.lines[k]); });

    '<p class="small">Change the quantity to what <b>actually arrived</b> (0 if it never came). The difference is taken off the order — so it shows as still to come — and out of stock at ' + esc(d.location || "") + '.</p>' +
    rows.map(function(x){ var l = (o.lines || {})[x.lid] || {};
      return '<div class="row" style="align-items:center;margin:8px 0;flex-wrap:nowrap"><div style="flex:1">' + esc(x.item || l.desc || l.text || "") + '<div class="small muted">received ' + esc(x.qty) + ' ' + esc(unitOf(l)) + ' → ' + esc(stockLabel(l)) + '</div></div>' +
        '<input type="number" min="0" step="any" inputmode="decimal" data-fixq="' + x.i + '" value="' + esc(x.qty) + '" style="width:90px"></div>'; }).join("") +
    '<label>Why? (shows on the order)</label><input id="fixNote" placeholder="e.g. Large gloves weren\'t on the delivery note">' +
    '<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="mCancel">Cancel</button><button class="btn btn-primary" id="mOk">Save correction</button></div>');
  document.getElementById("mCancel").onclick = closeModal;
  document.getElementById("mOk").onclick = async function(){
    if(!freshUser()) return;
    var ch = [];
    rows.forEach(function(x){ var e = document.querySelector('[data-fixq="' + x.i + '"]'); var nv = Math.max(0, num(e && e.value)); if(nv < num(x.qty) - 1e-9) ch.push({ x:x, nv:nv, diff:r2(num(x.qty) - nv) }); else if(nv > num(x.qty) + 1e-9) ch.push({ bad:true }); });
    if(ch.some(function(c){ return c.bad; })){ toast("You can only lower quantities here. To receive more, use “Receive delivery”.", "err"); return; }
    if(!ch.length){ toast("Nothing changed.", "err"); return; }
    var note = document.getElementById("fixNote").value.trim();
    for(var i = 0; i < ch.length; i++){ var l = (o.lines || {})[ch[i].x.lid] || {}, t = targetOf(l.stock);
      if(t === "board" && !canBoard(user) && !user.isRoot){ toast("You can't change Board Stock — ask Sean.", "err"); return; }
      if(t === "consumables" && !canCons(user) && !user.isRoot){ toast("You can't change Consumables — ask Sean.", "err"); return; }
      ch[i].l = l; ch[i].t = t; }
    if(!confirm("Take these off the order and out of stock at " + (d.location || "") + "?\n\n" + ch.map(function(c){ return "• " + c.diff + " × " + (c.x.item || ""); }).join("\n"))) return;
    var btn = this; btn.disabled = true;
    try{
      var loc = d.location || o.location, who = user.username, reason = "Correction — not delivered" + (d.docRef ? " (" + d.docRef + ")" : "") + " from " + o.supplier + (note ? ": " + note : "");
      await removeBoards(ch.filter(function(c){ return c.t === "board"; }).map(function(c){ return { stock:c.l.stock, qty:c.diff }; }), loc, who, reason);
      await removeCons(ch.filter(function(c){ return c.t === "consumables"; }).map(function(c){ return { stock:c.l.stock, sq:toStockQty(c.l, c.diff) }; }), loc);
      var res = await db.ref("orders/list/" + o.id).transaction(function(cur){
        if(!cur || !cur.deliveries || !cur.deliveries[did]) return;
        var dl = cur.deliveries[did];
        ch.forEach(function(c){
          var ln = cur.lines && cur.lines[c.x.lid]; if(ln) ln.received = Math.max(0, r2(num(ln.received) - c.diff));
          var row = dl.lines && dl.lines[c.x.i]; if(row){ if(row.was === undefined) row.was = row.qty; row.qty = c.nv; }
        });
        dl.corrections = dl.corrections || {};
        dl.corrections[uid()] = { ts:new Date().toISOString(), user:who, note:(note || "not on the delivery note") + " — " + ch.map(function(c){ return "removed " + c.diff + " × " + (c.x.item || ""); }).join(", ") };
        var left = Object.keys(cur.lines || {}).some(function(k){ return num(cur.lines[k].qty) - num(cur.lines[k].received) > 0.0001; });
        var anyIn = Object.keys(cur.lines || {}).some(function(k){ return num(cur.lines[k].received) > 0; });
        if(cur.status !== "closed") cur.status = left ? (anyIn ? "part" : "ordered") : "received";
        return cur;
      });
      if(!res.committed) throw new Error("The order didn't update — check your connection.");
      closeModal(); toast("Corrected — " + ch.length + " line" + (ch.length===1?"":"s") + " taken off the order and out of stock.", "ok"); render();
    }catch(e){ btn.disabled = false; console.warn(e); toast("Couldn't save: " + (e.message || e), "err"); }
  };
}
async function removeBoards(items, loc, who, reason){
  if(!items.length) return;
  var res = await db.ref("boardStock").transaction(function(cur){
    if(!cur) return;
    cur.boards = list(cur.boards); cur.log = list(cur.log);
    var ts = new Date().toISOString();
    items.forEach(function(x){
      var b = cur.boards.find(function(y){ return "b:" + y.code === x.stock; }); if(!b) return;
      if(!b.qty || typeof b.qty !== "object") b.qty = {};
      var q = Math.round(x.qty);
      b.qty[loc] = Math.max(0, (Number(b.qty[loc])||0) - q);
      var total = Object.keys(b.qty).reduce(function(a,k){ return a + (Number(b.qty[k])||0); }, 0);
      b.reorderNotified = total <= (Number(b.reorderLevel)||0);
      cur.log.unshift({ id:uid(), ts:ts, user:who, boardCode:b.code, action:"remove", qtyChange:-q, resultingQty:total, reason:reason });
    });
    return cur;
  });
  if(!res.committed) throw new Error("Board Stock didn't load — check your connection and try again.");
}
async function removeCons(items, loc){
  var base = "consumablesStock/";
  for(var i = 0; i < items.length; i++){
    var x = items[i], q = x.sq, parts = String(x.stock).split(":"), kind = parts[1], rid = parts.slice(2).join(":");
    if(kind === "s") await db.ref(base + "screwItems/" + rid + "/qtyByLocation/" + fbKey(loc)).transaction(function(v){ return Math.max(0, r2((Number(v)||0) - q)); });
    else if(kind === "l") await db.ref(base + "consumableTypes/" + rid + "/volumeByLocation/" + fbKey(loc)).transaction(function(v){ return Math.max(0, (Number(v)||0) - Math.round(q*1000)); });
    else if(kind === "u"){
      // tins / containers are counted one by one: remove the newest full ones of that type here
      var snap = await db.ref(base + "consumableUnits").once("value"), all = snap.val() || {}, n = Math.round(q);
      var ids = Object.keys(all).filter(function(k){ var u = all[k]; return u && u.typeId === rid && u.location === loc && u.fillLevel === "Full"; })
        .sort(function(a,b){ return String(all[b].createdDate||"").localeCompare(String(all[a].createdDate||"")); }).slice(0, n);
      var upd = {}; ids.forEach(function(k){ upd[k] = null; });
      if(ids.length) await db.ref(base + "consumableUnits").update(upd);
    }
  }
}

async function poPdfBlob(){
  if(!window.html2canvas) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if(!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  var doc = document.getElementById("poDoc"); doc.classList.add("pdf-mode");
  try{
    var pdf = new window.jspdf.jsPDF({ unit:"mm", format:"a4", orientation:"portrait" });
    var pages = doc.querySelectorAll(".po-page");
    for(var i = 0; i < pages.length; i++){
      var c = await html2canvas(pages[i], { backgroundColor:"#ffffff", scale:2, useCORS:true });
      if(i) pdf.addPage("a4", "portrait");
      pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 210, 297);
    }
    return pdf.output("blob");
  } finally { doc.classList.remove("pdf-mode"); }
}
async function savePoPdf(o, download){
  var blob = await poPdfBlob(), name = "PO " + o.po + " - " + String(o.supplier || "").replace(/[\\/:*?"<>|]+/g, "") + ".pdf";
  if(download){ var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
  try{
    if(firebase.storage){ var ref = firebase.storage().ref("purchaseOrders/" + name.replace(/[^\w.\- ]+/g, "_")); await ref.put(blob, { contentType:"application/pdf" }); var url = await ref.getDownloadURL();
      await db.ref("orders/list/" + o.id).update({ poUrl:url }); o.poUrl = url; }
  }catch(e){ console.warn("PO upload", e); }
  return name;
}
// Sends the PO straight to the supplier (CC Sophie + extras) through EmailJS — the same
// sender the Consumables reorder emails use. Before 2026-10-05 this only opened a draft in
// the phone's email app, which never went out unless someone pressed Send there.
function poMailParts(o, withName){
  var lines = orderLines(o).map(function(l, i){ return (i + 1) + ". " + num(l.qty) + " × " + (l.desc || l.text || stockLabel(l)) + (l.size ? " (" + l.size + ")" : ""); });
  var sup = allSuppliers().find(function(s){ return s.name.toLowerCase() === String(o.supplier||"").toLowerCase(); }) || {};
  var contact = o.supplierContact || sup.contact || "";
  var body = "Good day" + (contact ? " " + contact : "") + ",\n\nPlease find our purchase order PO " + o.po + (o.ref ? " for your quote " + o.ref : "") + " below.\n\n" +
    (o.urgent ? "*** URGENT ORDER ***\n\n" : "") +
    lines.slice(0, 40).join("\n") + (lines.length > 40 ? "\n… and " + (lines.length - 40) + " more (see the PO)" : "") + "\n\n" +
    (o.jobNo ? "Sales order / job no.: " + o.jobNo + "\n" : "") +
    (o.collection ? "Collection: Oak Joinery will collect.\n" : "Deliver to: Oak Joinery — " + (o.location || "") + (addrFor(o.location) ? ", " + addrFor(o.location) : "") + "\n") +
    (o.asap ? (o.collection ? "Collection" : "Delivery") + " date: ASAP\n" : o.dueDate ? (o.collection ? "Collection" : "Delivery") + " date: " + fmtDate(o.dueDate) + "\n" : "") +
    (o.poUrl ? "\nPurchase order (PDF): " + o.poUrl + "\n" : "") +
    "\nPlease quote PO " + o.po + " on your delivery note and invoice.\n\nKind regards," + (withName ? "\n" + user.username + "\nOak Joinery (Pty) Ltd" : "");
  return { body:body, subject:(o.urgent ? "URGENT — " : "") + "Purchase Order PO " + o.po + " — Oak Joinery" };
}
function mailtoPo(o){
  var m = poMailParts(o, true);
  return "mailto:" + encodeURIComponent(o.supplierEmail).replace(/%40/g, "@") + "?cc=" + encodeURIComponent(allCc(o).join(",")).replace(/%40/g, "@").replace(/%2C/gi, ",") +
    "&subject=" + encodeURIComponent(m.subject) + "&body=" + encodeURIComponent(m.body);

async function emailPo(o){
  if(!canApprove()){ toast("Only people allowed to approve orders can send purchase orders.", "err"); return; }
  if(!o.supplierEmail){ toast("No supplier email saved — tap ✎ Edit PO details and add one first.", "err"); return; }
  var cc = allCc(o);
  if(!confirm("Email PO " + o.po + " to " + o.supplier + " now?\n\nTo: " + o.supplierEmail + "\nCC: " + cc.join(", "))) return;
  toast("Making the PDF…", "ok");
  await savePoPdf(o, false);
  var m = D.cons.meta || {}, cfg = { service:m.emailjsServiceId, template:m.emailjsTemplateId, key:m.emailjsPublicKey };
  var fallback = function(why){
    if(confirm("The PO couldn't be emailed automatically (" + why + ").\n\nOpen it in your email app instead? You'll need to press Send there.")) window.location.href = mailtoPo(o);
  };
  if(!cfg.service || !cfg.template || !cfg.key){ fallback("the EmailJS settings in Consumables → Locations → Reorder email settings are empty"); return; }
  try{
    if(!window.emailjs) await loadScript("https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js");
    var parts = poMailParts(o, false);
    await window.emailjs.send(cfg.service, cfg.template, {
      to_email: o.supplierEmail, cc_email: cc.join(","), from_name: "Oak Joinery — " + user.username,
      item_name: parts.subject, subject: parts.subject, current_qty: "", reorder_qty: "", message: parts.body
    }, { publicKey: cfg.key });
    var now = new Date().toISOString();
    var log = {}; log[uid()] = { at:now, by:user.username, to:o.supplierEmail, cc:cc.join(", ") };
    await db.ref("orders/list/" + o.id).update({ poSentAt:now, poSentBy:user.username, poSentTo:o.supplierEmail, poSentCc:cc.join(", ") });
    await db.ref("orders/list/" + o.id + "/emailLog").update(log);
    toast("✓ PO " + o.po + " emailed to " + o.supplier + " (CC " + cc.join(", ") + ").", "ok");
    render();
  }catch(e){
    console.warn("EmailJS", e);
    fallback((e && (e.text || e.message)) || "no internet?");
  }
}

    qa("[data-st]").forEach(function(b){ b.onclick = function(){ readDraftFields(); draft.status = b.getAttribute("data-st"); render(); }; });
    bindFileInputs(function(f){ readDraftFields(); draft.file = f; readInto(f, function(raw){ var said = applyDraftDoc(); addDraftLines(raw, "file"); if(said.length) setTimeout(function(){ toast("Read " + said.join(" and ") + " from the document.", "ok"); }, 1800); }); });
    if(q("#pasteGo")) q("#pasteGo").onclick = function(){ readDraftFields(); addDraftLines(L.linesFromText(q("#pasteIn").value), "pasted text"); render(); };
    if(q("#addBlank")) q("#addBlank").onclick = function(){ readDraftFields(); draft.lines.push({ key:++seq, text:"", code:"", desc:"", size:"", qty:0, received:0, stock:"", how:"picked", score:1 }); render(); };
    qa("[data-stock]").forEach(function(s){ s.onchange = function(){ readDraftFields(); var l = draftLine(s.getAttribute("data-stock")); l.stock = s.value; l.how = "picked"; l.score = 1;
      if(l.stock === "new:board" && !l.nf) l.nf = { description:l.desc || l.text || "", category:l.size || "" };
      if(l.stock === "new:cons" && !l.nf) l.nf = { name:(l.desc || l.text || "").replace(/\s+/g, " ").trim(), unit:"each" };
      l.per = guessPer(l);
      render(); }; });
    qa("[data-per]").forEach(function(sel){ sel.onchange = function(){ draftLine(sel.getAttribute("data-per")).per = sel.value; }; });
    qa("[data-qty]").forEach(function(inp){ inp.oninput = function(){ draftLine(inp.getAttribute("data-qty")).qty = num(inp.value); }; inp.onchange = function(){ readDraftFields(); render(); }; });
    qa("[data-text]").forEach(function(inp){ inp.oninput = function(){ draftLine(inp.getAttribute("data-text")).desc = inp.value; }; });
    qa("[data-del]").forEach(function(b){ b.onclick = function(){ readDraftFields(); draft.lines = draft.lines.filter(function(l){ return String(l.key) !== b.getAttribute("data-del"); }); render(); }; });
    qa("[data-nf]").forEach(function(inp){ var h = function(){ var l = draftLine(inp.getAttribute("data-nf")); l.nf = l.nf || {}; l.nf[inp.getAttribute("data-f")] = inp.value.trim(); return l; }; inp.oninput = h;
      inp.onchange = function(){ var l = h(); if(inp.tagName === "SELECT" || inp.getAttribute("data-f") === "bundle"){ if(!l.per) l.per = guessPer(l); readDraftFields(); render(); } }; });
  }
  // receive
  if(ui.view === "receive" && rcv){
    if(q("#rSup")) q("#rSup").onchange = function(){ if(rcv.lines.length && !confirm("Changing supplier clears the lines below. Carry on?")){ this.value = rcv.supplier; return; } rcv.supplier = this.value; rcv.orderId = null; rcv.lines = [];
      if(rcv.supplier && rcv.pending){ var p = rcv.pending; rcv.pending = null; addRcvLines(p, "delivery note"); }
      render(); };
    if(q("#rLoc")) q("#rLoc").onchange = function(){
      if(rcv.lines.length && !rcv.orderId && !confirm("Changing location clears the lines below. Carry on?")){ this.value = rcv.location; return; }
      rcv.location = this.value; if(!rcv.orderId){ rcv.lines = []; if(!openLinesFor(rcv.supplier).length) rcv.supplier = ""; } render(); };
    if(q("#rRef")) q("#rRef").oninput = function(){ rcv.docRef = this.value.trim(); };
    if(q("#allOrders")) q("#allOrders").onclick = function(){ rcv.orderId = null; render(); };
    bindFileInputs(function(f){ rcv.file = f; readInto(f, function(raw){ rcvDoc(raw); }); });
    if(q("#allCame")) q("#allCame").onclick = function(){ if(rcv.lines.length && !confirm("Replace the lines below with everything still to come?")) return; fillAllOutstanding(); render(); };
    if(q("#addBlank")) q("#addBlank").onclick = function(){ rcv.lines.push({ key:++seq, src:{ text:"" }, qty:0, match:"", how:"picked", score:1 }); render(); };
    qa("[data-rmatch]").forEach(function(s){ s.onchange = function(){ var l = rcvLine(s.getAttribute("data-rmatch")); l.match = s.value; l.how = "picked"; l.skip = !s.value;
      if(l.match && !num(l.qty)){ var c = openLinesFor(rcv.supplier, rcv.orderId).find(function(x){ return x.id === l.match; }); if(c) l.qty = outstanding(c.line); }
      render(); }; });
    qa("[data-rqty]").forEach(function(inp){ inp.oninput = function(){ var l = rcvLine(inp.getAttribute("data-rqty")); l.qty = num(inp.value); if(l.qty > 0 && l.match) l.skip = false; }; inp.onchange = function(){ render(); }; });
    qa("[data-rdel]").forEach(function(b){ b.onclick = function(){ rcv.lines = rcv.lines.filter(function(l){ return String(l.key) !== b.getAttribute("data-rdel"); }); render(); }; });
  }
}
function draftLine(k){ return draft.lines.find(function(l){ return String(l.key) === String(k); }); }
function rcvLine(k){ return rcv.lines.find(function(l){ return String(l.key) === String(k); }); }
document.getElementById("commit").onclick = function(){
  if(busy) return;
  if(ui.view === "edit" && draft){ readDraftFields(); saveDraft(); }
  else if(ui.view === "receive" && rcv) saveReceive();
};

// ---------- start ----------
var started = false;
function start(){
  if(started) return; started = true;
  db = firebase.database();
  var rr = function(){ if(!busy) render(); };
  db.ref("boardStock").on("value", function(s){ D.board = s.val() || { boards:[], locations:["Main"] }; rr(); });
  ["screwItems","consumableTypes","suppliers","meta"].forEach(function(k){
    db.ref("consumablesStock/" + k).on("value", function(s){ D.cons[{ screwItems:"items", consumableTypes:"types", suppliers:"suppliers", meta:"meta" }[k]] = s.val() || {}; rr(); });
  });
  db.ref("stockIn/aliases").on("value", function(s){ D.aliases = s.val() || {}; });
  db.ref("suppliers/list").on("value", function(s){ D.sups = s.val() || {}; if(ui.view === "list") rr(); });
  db.ref("orders/poBook").on("value", function(s){ D.poBook = s.val() || null; if(ui.view === "list" || ui.view === "order") rr(); });
  db.ref("orders/list").on("value", function(s){ D.orders = s.val() || {}; D.loaded = true;
    // don't redraw under someone typing in a form
    if(ui.view === "list" || ui.view === "order") rr(); });
  var h = (location.hash || "").slice(1);
  if(h.indexOf("order=") === 0){ ui.view = "order"; ui.orderId = decodeURIComponent(h.slice(6)); }
  render();
}
try{
  core.init();
  core.startUsersSync(function(users){
    var r = S.resolve(users);
    if(r.status === "wait") return;
    if(r.status !== "ok"){ S.goHome({ next:"orders" }); return; }
    user = r.user;
    document.getElementById("who").textContent = user.username;
    start();
    if(!busy && (ui.view === "list" || ui.view === "order")) render();
  });
}catch(e){
  document.getElementById("app").innerHTML = '<div class="card"><h2>Could not start</h2><p class="muted">' + esc(e.message || String(e)) + '</p></div>';
}
if(!S.get()) S.goHome({ next:"orders" });
})();
</script>
<script>
/* Oak Joinery — shared "← Back" button (2026-09-30, per Sean: "let's put back
   buttons in all apps"). Adds a Back button next to every "☰ Menu" button and
   makes the phone's own back button do the same thing. Back goes, in order:
     1. out of an open pop-up (a delivery note opened from the list goes back
        to the list),
     2. to the previous screen in the app (Orders / Tools detail pages, or the
        last tab you were on),
     3. to the Oak Joinery menu.
   Apps can tell it about their tabs with window.OAK_BACK_TABS = { get, set }. */
(function(){
  "use strict";
  if (window.__oakBack) return; window.__oakBack = true;
  var tabStack = [], lastTab = null, goingBack = false;

  function visible(el){
    if (!el || !el.isConnected) return false;
    var cs = getComputedStyle(el);
    if (cs.display === "none" || cs.visibility === "hidden") return false;
    var r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }
  var OVERLAYS = "#noteBg, #allBg, .modal-bg, .modal-overlay, .mbg, #modal-root .modal-backdrop, #modal-root > div";
  function topOverlay(){
    var list = Array.prototype.slice.call(document.querySelectorAll(OVERLAYS)).filter(visible)
      .filter(function(el){ return el.id !== "loginOverlay" && !el.closest("#loginOverlay") && !/login/i.test(el.id || ""); });
    return list.length ? list[list.length - 1] : null;
  }
  function closeButtonIn(el){
    var b = el.querySelector(".note-back");
    if (b && visible(b)) return b;
    var btns = Array.prototype.slice.call(el.querySelectorAll("button")).filter(visible);
    return btns.find(function(x){ return /(^|\s)(close-x|modal-close)(\s|$)/.test(x.className) || x.id === "mCancel" || x.id === "modal-cancel"; }) ||
           btns.find(function(x){ return /^\s*(cancel|close|done|back|×|✕)\s*$/i.test(x.textContent); }) || null;
  }
  function goMenu(){
    try { if (window.OakCore && OakCore.session && OakCore.session.get()) { OakCore.session.goHome(); return; } } catch (e) {}
    location.href = "https://seanoakjoinery.github.io/oak-core/";
  }
  function back(){
    var ov = topOverlay();
    if (ov){
      var b = closeButtonIn(ov);
      if (b){ b.click(); return true; }
      if (typeof window.closeModal === "function"){ window.closeModal(); return true; }
      ov.remove(); return true;
    }
    var link = Array.prototype.slice.call(document.querySelectorAll(".backlink#back, #back.backlink")).filter(visible)[0];
    if (link){ link.click(); return true; }
    var T = window.OAK_BACK_TABS;
    if (T && tabStack.length){
      goingBack = true;
      var t = tabStack.pop(); lastTab = t;
      try { T.set(t); } finally { goingBack = false; }
      return true;
    }
    goMenu(); return false;
  }
  window.oakBack = back;

  // Remember the tab you came from.
  function trackTab(){
    var T = window.OAK_BACK_TABS; if (!T) return;
    var cur; try { cur = T.get(); } catch (e) { return; }
    if (cur === undefined || cur === null) return;
    if (lastTab !== null && cur !== lastTab && !goingBack){ tabStack.push(lastTab); if (tabStack.length > 30) tabStack.shift(); }
    lastTab = cur;
  }

  // Put a Back button in front of every Menu button (apps redraw, so keep checking).
  function addButtons(){
    var menus = Array.prototype.slice.call(document.querySelectorAll("button, a")).filter(function(x){
      return /☰\s*Menu/.test(x.textContent || "") && !x.dataset.oakBackDone;
    });
    menus.forEach(function(m){
      m.dataset.oakBackDone = "1";
      var b = document.createElement(m.tagName === "A" ? "button" : m.tagName);
      b.type = "button";
      b.className = m.className;
      b.setAttribute("style", (m.getAttribute("style") || "") + ";margin-right:6px");
      b.textContent = "← Back";
      b.title = "Back to the previous screen";
      b.addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); back(); });
      m.parentNode.insertBefore(b, m);
    });
  }
  function tick(){ addButtons(); trackTab(); }
  new MutationObserver(tick).observe(document.documentElement, { childList:true, subtree:true });
  document.addEventListener("click", function(){ setTimeout(trackTab, 0); }, true);
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tick); else tick();

  // The phone's own back button does the same as the Back button.
  try {
    history.pushState({ oakBack:1 }, "");
    window.addEventListener("popstate", function(){
      var stay = back();
      if (stay) history.pushState({ oakBack:1 }, "");
    });
  } catch (e) {}
})();
</script>
