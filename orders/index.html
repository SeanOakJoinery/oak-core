<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E1C18">
<meta name="description" content="Oak Joinery Orders — track what's been ordered from suppliers, tick off deliveries and add them to Board Stock or Consumables.">
<title>Orders</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>

:root{--bg:#1E1C18;--panel:#26221C;--panel-2:#2E2A22;--text:#EFE8D8;--muted:#9C9280;--amber:#E3A23A;--amber-dim:#3B2E1A;--line:#433D32;--green:#5FA76E;--green-dim:#1F3325;--rust:#C46A4A;--rust-dim:#3A231B;
  --font-b:"Inter",system-ui,-apple-system,sans-serif;--font-m:"Space Grotesk","Inter",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:calc(14px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:8px}
.brand .t{font-family:var(--font-m);font-weight:600;font-size:18px}
.brand .s{font-size:12px;color:var(--muted)}
h2{font-family:var(--font-m);font-weight:600;font-size:17px;margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--amber-dim);color:var(--amber);font-size:12px;font-weight:600;margin-right:8px;vertical-align:1px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.seg button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px 10px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{border-color:var(--amber);background:var(--amber-dim);color:var(--amber)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 11px;font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber)}
textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text);text-decoration:none}
.btn-primary{background:var(--amber);border-color:var(--amber);color:#1E1C18}
.btn-sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--amber);background:var(--amber-dim)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{color:var(--amber);border-color:var(--amber)}
.status{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px}
.bar{height:4px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .2s}
.lines{display:grid;gap:10px}
.line{background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px}
.line.ok{border-left-color:var(--green)}
.line.check{border-left-color:var(--amber)}
.line.new{border-left-color:#6FA0C8}
.line.skip{opacity:.55}
.line .src{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);word-break:break-word;margin-bottom:6px}
.line .lrow{display:grid;grid-template-columns:1fr 92px 34px;gap:8px;align-items:center}
.line .unit{font-size:12px;color:var(--muted)}
.line .x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.line .newf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.line .newf label{margin:0 0 3px}
.tag{font-size:11px;border-radius:99px;padding:2px 8px;margin-left:6px}
.tag.ok{background:var(--green-dim);color:var(--green)}.tag.check{background:var(--amber-dim);color:var(--amber)}.tag.new{background:#1C2A36;color:#8FB9DB}
.sum{position:fixed;left:0;right:0;bottom:0;background:rgba(30,28,24,.96);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
.sum .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.hist{list-style:none;margin:0;padding:0}
.hist li{border-top:1px solid var(--line);padding:9px 0;font-size:13px}
.hist li:first-child{border-top:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);padding:10px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:50}
.toast.show{opacity:1}.toast.err{border-color:var(--rust)}.toast.ok{border-color:var(--green)}
.empty{padding:14px;text-align:center;color:var(--muted);font-size:13px}
.hide{display:none!important}

.olist{display:grid;gap:10px}
.ord{background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}
.ord:hover{border-color:var(--amber)}
.ord.late{border-left-color:var(--rust)}
.ord.part{border-left-color:var(--amber)}
.ord.done{border-left-color:var(--green);opacity:.8}
.ord.quote{border-left-color:#6FA0C8}
.ord .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ord .h b{font-size:15px}
.pill{font-size:11px;border-radius:99px;padding:2px 8px;white-space:nowrap}
.pill.quote{background:#1C2A36;color:#8FB9DB}.pill.ordered{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.pill.part{background:var(--amber-dim);color:var(--amber)}.pill.received{background:var(--green-dim);color:var(--green)}
.pill.late{background:var(--rust-dim);color:#E39A80}.pill.closed{background:var(--panel);color:var(--muted)}
.prog{height:5px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--green)}
table.ol{width:100%;border-collapse:collapse;font-size:14px}
table.ol th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:6px 6px;border-bottom:1px solid var(--line)}
table.ol td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.ol td.n{text-align:right;white-space:nowrap}
table.ol tr.out td.n.o{color:var(--amber);font-weight:600}
table.ol tr.full td{color:var(--muted)}
.alert{border-color:var(--rust)}
.alert h2{color:#E39A80}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.backlink{background:none;border:none;color:var(--amber);font:inherit;cursor:pointer;padding:0;margin-bottom:10px}
.line .lrow.r{grid-template-columns:1fr 92px 34px}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="../icon-192.png" alt=""><div><div class="t">Orders</div><div class="s" id="who">Oak Joinery</div></div></div>
    <a class="btn btn-sm" href="../">☰ Menu</a>
  </header>
  <main id="app"><div class="card muted">Loading…</div></main>
</div>
<div class="sum hide" id="sum"><div class="in"><div id="sumText" class="small"></div><button class="btn btn-primary" id="commit">Save</button></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../oak-core.js?v=3"></script>
<script>
/* Oak Joinery — Stock In helpers (pure functions, no Firebase/DOM).
 * Turns pasted text, Excel rows, PDF text and OCR text into lines
 * {code, desc, size, job, material, notes, qty, qtyL, text}, and matches
 * each line to an item in Board Stock, Consumables or Stock List.
 * Loaded by stock-in/index.html; also require()-able in node for tests. */
(function (global) {
  "use strict";

  // ---------- text helpers ----------
  function norm(s) {
    return String(s == null ? "" : s).toLowerCase()
      .replace(/[×]/g, "x")
      .replace(/(\d)\s*x\s*(\d)/g, "$1x$2")
      .replace(/(\d),(\d{3})\b/g, "$1$2")
      .replace(/[^a-z0-9.x]+/g, " ")
      .replace(/\s+/g, " ").trim();
  }
  var SYN = {
    supawood: "mdf", mdf: "mdf", "m.d.f": "mdf",
    chipboard: "chip", particleboard: "chip", pb: "chip", chip: "chip",
    melamine: "mel", mel: "mel", mfc: "mel", mf: "mel",
    wht: "white", wh: "white", blk: "black",
    ply: "plywood", plywood: "plywood",
    pr: "pair", prs: "pair", pairs: "pair",
    pk: "pack", pkt: "pack", pkts: "pack", packs: "pack",
    ltr: "l", ltrs: "l", litre: "l", litres: "l", liter: "l", liters: "l",
    screws: "screw", hinges: "hinge", runners: "runner", handles: "handle"
  };
  // Board sheet sizes in mm → the ft names used in Board Stock ("9x6").
  var SHEET = { "2750x1830": "9x6", "2745x1830": "9x6", "2800x1830": "9x6", "2440x1220": "8x4", "2440x1830": "8x6", "3660x1830": "12x6", "3050x1830": "10x6", "1830x2750": "9x6", "1830x3660": "12x6" };
  function tokens(s) {
    var out = [];
    norm(s).split(" ").forEach(function (t) {
      if (!t) return;
      if (SHEET[t]) { out.push(SHEET[t]); return; }
      var m = t.match(/^(\d+(?:\.\d+)?)(mm|m|l|ml|kg|g|x)$/);
      if (m) { out.push(m[1]); if (m[2] !== "x") out.push(m[2]); return; }
      if (SYN[t]) { out.push(SYN[t]); return; }
      out.push(t);
    });
    return out;
  }
  function isNum(t) { return /^\d+(\.\d+)?$/.test(t); }

  var STOP = /\b(business park|industrial park|exporters|street|avenue|road|drive|postnet|p\.?\s?o\.? box|private bag|suite \d|sales code|sales rep|salesperson|lead time|expires|valid until|att\b|attention|account no|branch code|swift|reference|ref no|your ref|customer no|cust no|order date|printed|telephone|phone|cell|mobile|fax|reg\.? no|co reg|total|sub ?total|vat|tax|invoice|tel|fax|page|bank|account|acc no|branch|email|e-mail|www|http|reg no|registration|balance|amount due|terms|signature|signed|received by|driver|deliver to|delivery address|order no|date|customer|vat no|thank you|delivery note|credit note|quotation|quote no|purchase order|po no|p\/o)\b/i;

  // Header words → field
  var HEAD = {
    code: ["code", "item code", "product code", "stock code", "sku", "part no", "part number", "item no", "article", "ref", "board code"],
    desc: ["description", "item", "product", "desc", "item description", "product description", "details", "name", "board"],
    qty: ["qty", "quantity", "qty delivered", "qty supplied", "delivered", "supplied", "qty shipped", "units", "qty r", "qty right", "count", "qty ordered"],
    qtyL: ["qty l", "qty left", "left"],
    size: ["size", "dimensions", "dimension"],
    job: ["job", "category", "cat", "category / job"],
    material: ["material"],
    notes: ["notes", "note", "comment", "comments"]
  };
  function headField(h) {
    var n = String(h || "").trim().toLowerCase().replace(/[:.]/g, "").replace(/\s+/g, " ");
    for (var f in HEAD) if (HEAD[f].indexOf(n) >= 0) return f;
    return null;
  }

  function toQty(v) {
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return isFinite(v) ? v : null;
    var s = String(v).trim().replace(/\s/g, "").replace(/,(\d{1,2})$/, ".$1").replace(/,/g, "");
    var m = s.match(/^-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }

  // ---------- table rows (Excel / pasted tab-separated) ----------
  // rows: array of arrays. Returns lines, or null if no header row found.
  function linesFromTable(rows) {
    rows = (rows || []).filter(function (r) { return r && r.some(function (c) { return String(c == null ? "" : c).trim() !== ""; }); });
    var hi = -1, map = null;
    for (var i = 0; i < Math.min(rows.length, 15); i++) {
      var m = {}, hits = 0;
      rows[i].forEach(function (c, j) { var f = headField(c); if (f && m[f] === undefined) { m[f] = j; hits++; } });
      if (hits >= 2 && (m.qty !== undefined) && (m.desc !== undefined || m.code !== undefined)) { hi = i; map = m; break; }
    }
    if (hi < 0) return null;
    var out = [];
    rows.slice(hi + 1).forEach(function (r) {
      var get = function (f) { return map[f] === undefined ? "" : String(r[map[f]] == null ? "" : r[map[f]]).trim(); };
      var line = { code: get("code"), desc: get("desc"), size: get("size"), job: get("job"), material: get("material"), notes: get("notes"),
        qty: toQty(map.qty === undefined ? null : r[map.qty]), qtyL: map.qtyL === undefined ? null : toQty(r[map.qtyL]) };
      if (!line.code && !line.desc) return;
      if (STOP.test(line.desc) && !line.code) return;
      line.text = [line.code, line.desc, line.size].filter(Boolean).join("  ");
      out.push(line);
    });
    return out;
  }

  // ---------- free text lines (PDF text / OCR / pasted text) ----------
  function parseTextLine(raw) {
    var text = String(raw || "").replace(/\t/g, "  ").replace(/[|]/g, " ").trim();
    if (!text || text.length < 3) return null;
    if (!/[a-z]/i.test(text) || !/\d/.test(text)) return null;
    if (STOP.test(text)) return null;
    var toks = text.split(/\s+/);
    var info = toks.map(function (t, i) {
      var clean = t.replace(/^[^\w]+|[^\w.,]+$/g, "");
      var plainInt = /^\d{1,5}([.,]0{1,3})?$/.test(clean);
      var price = /^\d{1,3}([ ,]\d{3})*[.,]\d{2}$/.test(clean) && !/[.,]00?$/.test(clean);
      var money = /^R\d/i.test(t) || /%$/.test(t);
      var code = /[a-z]/i.test(clean) && /\d/.test(clean) && clean.length >= 3 && clean.length <= 20 && !/^\d+(mm|m|l|ml|kg|g)$/i.test(clean) && !/^\d+x\d+/i.test(clean);
      return { t: t, clean: clean, i: i, plainInt: plainInt && !money, strictInt: /^\d{1,5}$/.test(clean) && !money, price: price || money, code: code, alpha: /^[a-z][a-z&'/-]*$/i.test(clean) };
    });
    var qtyIdx = -1;
    // "... x 8" or "qty 8" at the end of the line
    var L = info.length;
    if (L > 2 && info[L - 1].plainInt && /^(x|qty|qty:)$/i.test(info[L - 2].clean || info[L - 2].t)) qtyIdx = L - 1;
    // Delivery-note style: "10  CH16  16mm chipboard" — leading number.
    if (qtyIdx < 0 && info.length > 1 && info[0].plainInt && !info[1].plainInt) qtyIdx = 0;
    if (qtyIdx < 0) {
      // Invoice style: CODE DESCRIPTION QTY PRICE ... TOTAL — first plain
      // integer after some description words, preferring one followed by a price.
      var UNITW = /^(thd|th|ea|each|pcs|pc|no|nos|units?|sheets?|pr|prs|pairs?|box|boxes|pk|pkt|packs?|rolls?|m|l|ltr|kg|lengths?|bags?)$/i;
      var seenWord = false, firstAfter = -1, withPrice = -1, looseFirst = -1;
      for (var k = 0; k < info.length; k++) {
        if (info[k].alpha) seenWord = true;
        if (seenWord && info[k].plainInt && !info[k].strictInt) {
          if (looseFirst < 0) looseFirst = k;
          var jj = k + 1; while (info[jj] && /^(thd|th|ea|each|pcs|pc|no|nos|units?|sheets?|pr|prs|pairs?|box|boxes|pk|pkt|packs?|rolls?|m|l|ltr|kg|lengths?|bags?)$/i.test(info[jj].clean)) jj++;
          if (withPrice < 0 && info[jj] && (info[jj].price || /^R?\d[\d ,]*[.,]\d{2}$/i.test(info[jj].clean))) withPrice = k;
          continue;
        }
        if (seenWord && info[k].strictInt) {
          var prev = info[k - 1] && info[k - 1].clean.toLowerCase();
          var next = info[k + 1] && info[k + 1].clean.toLowerCase();
          if (next && /^(mm|m|x|ml|l|kg|g|mic|micron)$/.test(next)) continue; // "16 mm"
          if (prev === "x" || (next === "x")) continue;
          if (firstAfter < 0) firstAfter = k;
          var j = k + 1; while (info[j] && UNITW.test(info[j].clean)) j++;
          var nx = info[j];
          if (withPrice < 0 && nx && (nx.price || /^R?\d[\d ,]*[.,]\d{2}$/i.test(nx.clean))) withPrice = k;
        }
      }
      if (firstAfter >= 0 && looseFirst >= 0 && looseFirst < firstAfter && toQty(info[firstAfter].clean) >= 1000) firstAfter = -1;
      if (withPrice >= 0 && looseFirst >= 0 && looseFirst < withPrice && toQty(info[withPrice].clean) >= 1000) withPrice = looseFirst;
      qtyIdx = withPrice >= 0 ? withPrice : (firstAfter >= 0 ? firstAfter : looseFirst);
    }
    if (qtyIdx < 0) return null;
    var qty = toQty(info[qtyIdx].clean);
    if (!qty || qty <= 0 || qty > 100000) return null;
    var codeTok = info.find(function (x) { return x.i !== qtyIdx && x.code && x.i < (qtyIdx === 0 ? 3 : qtyIdx); });
    var descEnd = qtyIdx === 0 ? info.length : qtyIdx;
    var desc = info.filter(function (x) { return x.i < descEnd && !(qtyIdx === L - 1 && x.i === L - 2 && /^(x|qty:?)$/i.test(x.t)) && x.i !== qtyIdx && (!codeTok || x.i !== codeTok.i) && !x.price; })
      .map(function (x) { return x.t; }).join(" ").replace(/\s+/g, " ").trim();
    // Drop trailing unit words ("EA", "each") from the description
    desc = desc.replace(/\s+(ea|each|pcs|pc|no|unit|units|sheets?)$/i, "");
    if (!desc && !codeTok) return null;
    // OCR noise ("i Lo a J 4 ie"): need real words
    var words = (desc.match(/[A-Za-z]{3,}/g) || []);
    if (!words.length || (!codeTok && words.length < 2 && !/[A-Za-z]{5,}/.test(desc))) return null;
    return { code: codeTok ? codeTok.clean : "", desc: desc, size: "", job: "", material: "", notes: "", qty: qty, qtyL: null, text: text.replace(/\s{2,}/g, "  ") };
  }

  // Invoices/quotes: only read the item table — the lines after the column
  // header row ("Code  Description  Qty ...") up to the totals/footer.
  var HEADROW = /\b(qty|quantity|qnty|units?)\b/i, HEADDESC = /\b(description|desc|item|product|details)\b/i;
  var FOOT = /\b(total item|net value|sub ?total|total excl|total incl|total vat|vat total|amount due|balance due|terms and conditions|terms of|banking details|deliver to|delivery address|received by|thank you)\b/i;
  function linesFromDoc(text) {
    var rows = String(text || "").split(/\r?\n/);
    var out = [], inTable = false, found = false;
    rows.forEach(function (r) {
      if (!inTable && HEADROW.test(r) && HEADDESC.test(r) && !/\d{3,}/.test(r)) { inTable = true; found = true; return; }
      if (inTable && FOOT.test(r)) { inTable = false; return; }
      if (inTable) { var l = parseTextLine(r); if (l) out.push(l); }
    });
    return found && out.length ? out : linesFromText(text);
  }

  function linesFromText(text) {
    var rows = String(text || "").split(/\r?\n/);
    // Tab-separated paste with a header row → treat as a table.
    if (rows.some(function (r) { return r.indexOf("\t") >= 0; })) {
      var t = linesFromTable(rows.map(function (r) { return r.split("\t"); }));
      if (t && t.length) return t;
    }
    return rows.map(parseTextLine).filter(Boolean);
  }

  // PDF.js text items → text lines (grouped by y, gaps kept as double spaces).
  function pdfItemsToText(items) {
    var rows = [];
    items.forEach(function (it) {
      if (!it.str || !it.str.trim()) return;
      var x = it.transform[4], y = it.transform[5];
      var row = rows.find(function (r) { return Math.abs(r.y - y) < 3; });
      if (!row) { row = { y: y, parts: [] }; rows.push(row); }
      row.parts.push({ x: x, w: it.width || 0, s: it.str });
    });
    rows.sort(function (a, b) { return b.y - a.y; });
    return rows.map(function (r) {

    await ref.put(file); return await ref.getDownloadURL();

// ---------- reading the supplier and document number off a quote / delivery note ----------
var SUP_STOP = { pty:1, ltd:1, limited:1, cc:1, the:1, and:1, sa:1, south:1, africa:1, co:1, company:1, inc:1, ta:1, of:1, group:1, holdings:1, trading:0 };
function plain(t){ return " " + String(t || "").toLowerCase().replace(/[^a-z0-9@.]+/g, " ").replace(/\s+/g, " ") + " "; }
function supKeys(name){ return plain(name).trim().split(" ").filter(function(w){ return w.length >= 3 && !SUP_STOP[w] && !/^\d+$/.test(w); }); }
function isUs(t){ return /oak\s*joinery/i.test(t || ""); }
// Best known supplier named in the text (by email domain or by the words of its name).
function detectSupplier(text, cands){
  var T = plain(text), best = null, bs = 0;
  (cands || []).forEach(function(c){
    if(!c || !c.name || isUs(c.name)) return;
    var sc = 0, dom = String(c.email || "").toLowerCase().split("@")[1];
    if(dom && dom.length > 4 && T.indexOf(dom) >= 0) sc = 1;
    else {
      var k = supKeys(c.name); if(!k.length) return;
      var hits = k.filter(function(w){ return T.indexOf(" " + w + " ") >= 0; }).length;
      if(hits === k.length) sc = 0.9 + Math.min(k.length, 5) / 100;
      else if(hits >= 2 && hits / k.length >= 0.6) sc = 0.6 + hits / 100;
    }
    if(sc > bs){ bs = sc; best = c; }
  });
  return bs >= 0.6 ? best : null;
}
// A company name printed near the top that isn't us, e.g. "Jamac Technological Industries CC".
function guessSupplierName(text){
  var lines = String(text || "").split(/\n/).slice(0, 25);
  for(var i = 0; i < lines.length; i++){
    var ln = lines[i].replace(/\s{2,}.*$/, "").trim();
    if(!ln || isUs(ln)) continue;
    var m = ln.match(/^(.{2,60}?\b(?:\(pty\)\s*ltd|pty\s*ltd|\(pty\)|limited|ltd|cc))\b/i);
    if(m && !/\b(bank|account|reg|vat|invoice|quot)/i.test(m[1])) return m[1].replace(/\s+/g, " ").trim();
  }
  return "";
}
function guessEmail(text){
  var all = String(text || "").match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g) || [];
  return all.find(function(e){ return !/oakjoinery/i.test(e); }) || "";
}
function detectRef(text, kind){
  var t = String(text || "");
  var pats = kind === "quote"
    ? [/\b(?:quot(?:e|ation)|qte|quo)\s*(?:no\.?|number|nr|#)?\s*[:\-]?\s*([A-Z]{0,5}[-\/]?\d[\w\-\/]{2,})/i, /\b((?:QU|QUO|QTE|SOQ)[-\s]?\d{3,}[\w-]*)\b/]
    : [/\b(?:delivery\s*note|d\/n|tax\s*invoice|invoice|inv)\s*(?:no\.?|number|nr|#)?\s*[:\-]?\s*([A-Z]{0,5}[-\/]?\d[\w\-\/]{2,})/i, /\b((?:IN|INV|DN|SO)[-\s]?\d{4,}[\w-]*)\b/];
  for(var i = 0; i < pats.length; i++){ var m = t.match(pats[i]); if(m && m[1] && !/^\d{1,3}$/.test(m[1])) return m[1].replace(/\s+/g, "").slice(0, 30); }
  return "";
}
function applyDraftDoc(){
  var said = [];
  if(!draft.supplier.trim()){
    var s = detectSupplier(docText, allSuppliers());
    if(s){ draft.supplier = s.name; if(!draft.supplierEmail && s.email) draft.supplierEmail = s.email; said.push("supplier " + s.name); }
    else { var g = guessSupplierName(docText); if(g){ draft.supplier = g; said.push("supplier " + g + " (new — check the name)"); } }
  }
  if(!draft.supplierEmail){ var e = guessEmail(docText); if(e){ draft.supplierEmail = e; } }
  if(!draft.ref){ var r = detectRef(docText, "quote"); if(r){ draft.ref = r; said.push("no. " + r); } }
  return said;
}
// Quotation / order lines → draft lines matched to stock
function addDraftLines(raw, source){
  if(!raw.length){ toast("No lines with a quantity found in that " + source + ".", "err"); return; }
  var cc = {}; raw.forEach(function(l){ var c = L.norm(l.code); if(c) cc[c] = (cc[c]||0) + 1; });
  raw.forEach(function(l){
    var m = matchStock(l, L.norm(l.code) && cc[L.norm(l.code)] === 1);
    draft.lines.push({ key:++seq, text:l.text || [l.code,l.desc,l.size].filter(Boolean).join("  "), code:l.code||"", desc:l.desc||"", size:l.size||"", qty:num(l.qty), received:0,
      stock:m.score >= 0.5 ? m.id : "", how:m.how, score:m.score });
    var nl = draft.lines[draft.lines.length - 1]; nl.per = guessPer(nl);
  });
  var got = draft.lines.filter(function(x){ return x.stock; }).length;
  toast("Read " + raw.length + " line" + (raw.length===1?"":"s") + " — " + got + " matched to stock. Check them below.", "ok");
}

function openLinesFor(supplier, onlyId){
  var key = String(supplier||"").trim().toLowerCase(), out = [], loc = rcv ? rcv.location : "";
  ordersArr().filter(function(o){ return isOpen(o) && (onlyId ? o.id === onlyId : (String(o.supplier||"").trim().toLowerCase() === key && atLoc(o, loc))); })
    .sort(function(a,b){ return String(a.orderedDate).localeCompare(String(b.orderedDate)); })
    .forEach(function(o){ orderLines(o).forEach(function(l){ if(outstanding(l) > 0) out.push({ id:o.id + "|" + l.lid, oid:o.id, lid:l.lid, order:o, line:l,
      label:(l.desc || l.text || stockLabel(l)).slice(0, 70) + " — " + outstanding(l) + " " + unitOf(l) + " to come" + (o.ref ? " (" + o.ref + ")" : ""),
      code:l.code || "", desc:l.desc || "", size:l.size || "", text:[l.code, l.desc || l.text, l.size, stockLabel(l)].join(" ") }); }); });
  return out;
}
function startReceive(supplier, orderId){

function addRcvLines(raw, source){
  if(!raw.length){ toast("No lines with a quantity found in that " + source + ".", "err"); return; }
  var cands = openLinesFor(rcv.supplier, rcv.orderId);
  var its = cands.map(function(c){ return { id:c.id, code:c.code, desc:c.desc, size:c.size, text:c.text }; });
  var cc = {}; raw.forEach(function(l){ var c = L.norm(l.code); if(c) cc[c] = (cc[c]||0) + 1; });
  var got = 0;
  raw.forEach(function(l){
    var m = L.matchLine(l, its, {}, {});
    var match = m.itemId || "", how = m.how, score = m.score;
    if(!match){
      // compare the wording and sizes with each open order line (prices and quantities ignored)
      var best = null, bs = 0, second = 0;
      cands.forEach(function(c){ var sc = rcvScore(l, c.line); if(sc > bs){ second = bs; bs = sc; best = c; } else if(sc > second) second = sc; });
      if(best && bs >= 0.6 && (bs - second > 0.05 || cands.length === 1)){ match = best.id; how = "fuzzy"; score = bs >= 0.9 ? 0.9 : bs; }
    }
    if(!match){
      // try via the stock item: supplier wording learned in Stock In → board/consumable → the order line for it
      var s = matchStock(l, L.norm(l.code) && cc[L.norm(l.code)] === 1);
      var c = s.score >= 0.75 && cands.find(function(x){ return x.line.stock === s.id; });
      if(c){ match = c.id; how = "stock"; score = s.score; }
    }
    if(match) got++;
    rcv.lines.push({ key:++seq, src:l, qty:num(l.qty), match:match, how:how, score:score });
  });
  toast("Read " + raw.length + " line" + (raw.length===1?"":"s") + " — " + got + " matched to the order. Check them below.", "ok");
}
function wordsNums(str){
  var t = L.tokens(str || ""), w = [], n = [];
  t.forEach(function(x){ if(/^\d+(\.\d+)?$/.test(x)) { if(n.indexOf(x) < 0) n.push(x); } else if(x.length > 1 && w.indexOf(x) < 0) w.push(x); });
  return { w:w, n:n };
}
function rcvScore(src, line){
  if(src.code && line.code && L.norm(src.code) === L.norm(line.code)) return 1;
  var a = wordsNums([src.code, src.desc || src.text].join(" ")), b = wordsNums([line.code, line.desc || line.text].join(" "));
  if(!a.w.length || !b.w.length) return 0;
  var inter = a.w.filter(function(x){ return b.w.indexOf(x) >= 0; }).length;
  var words = 2 * inter / (a.w.length + b.w.length);
  var nums = !a.n.length && !b.n.length ? 1 : (!a.n.length || !b.n.length) ? 0.5 : a.n.filter(function(x){ return b.n.indexOf(x) >= 0; }).length / Math.max(a.n.length, b.n.length);
  return words * 0.6 + nums * 0.4;
}

function sameBoard(b, n){ return String(b.description||"").trim().toLowerCase() === String(n.description||"").trim().toLowerCase() && String(b.category||"").trim().toLowerCase() === String(n.category||"").trim().toLowerCase(); }
function newBoardCode(boards, desc){
  var k = String(desc||"").toUpperCase().replace(/[^A-Z0-9]+/g, "").slice(0, 10), base = k ? "B" + k : "BOARD", code = base, i = 2;

}
async function addBoards(items, loc, who, reason){
  if(!items.length) return;
  var res = await db.ref("boardStock").transaction(function(cur){
    if(!cur) return;
    cur.boards = list(cur.boards); cur.log = list(cur.log);
    var locs = (cur.locations && cur.locations.length) ? cur.locations : ["Main"], ts = new Date().toISOString();
    items.forEach(function(x){
      var q = Math.round(x.qty), b;
      if(x.stock === "new:board"){
        b = cur.boards.find(function(y){ return sameBoard(y, x.nf); });
        if(!b){ b = { code:newBoardCode(cur.boards, x.nf.description), description:x.nf.description, category:x.nf.category||"", unit:"EA", qty:{}, reorderLevel:0, reorderNotified:false, supplierId:"" }; cur.boards.push(b); }
      } else b = cur.boards.find(function(y){ return y.code === x.stock.slice(2); });
      if(!b) throw new Error("A board on this order was deleted in Board Stock — edit the order and pick it again.");
      x.newStock = "b:" + b.code;

      if(!b.qty || typeof b.qty !== "object") b.qty = {};
      b.qty[loc] = (Number(b.qty[loc])||0) + q;
      var total = Object.keys(b.qty).reduce(function(a,k){ return a + (Number(b.qty[k])||0); }, 0);
      b.reorderNotified = total <= (Number(b.reorderLevel)||0);

}
async function addCons(items, loc){

  try{
    await addBoards(items.filter(function(x){ return x.t === "board"; }), loc, who, reason);
    await addCons(items.filter(function(x){ return x.t === "consumables"; }), loc);
    var fileUrl = r.file ? await uploadDoc("orderDocs", did, r.file) : "";
    var ts = new Date().toISOString();
    for(var oid in byOrder){
      var its = byOrder[oid];
      var res = await db.ref("orders/list/" + oid).transaction(function(o){
        if(!o) return;
        its.forEach(function(x){ var l = o.lines && o.lines[x.c.lid]; if(!l) return;
          l.received = r2(num(l.received) + x.qty);
          if(x.newStock && x.newStock !== l.stock){ l.stock = x.newStock; delete l.nf; } });
        o.deliveries = o.deliveries || {};
        o.deliveries[did] = { ts:ts, user:who, docRef:r.docRef || "", location:loc, fileUrl:fileUrl, fileName: r.file ? r.file.name : "",
          lines: its.map(function(x){ return { lid:x.c.lid, qty:x.qty, item:(x.c.line.desc || x.c.line.text || stockLabel(x.c.line)).slice(0,80) }; }) };
        var left = Object.keys(o.lines||{}).some(function(k){ return num(o.lines[k].qty) - num(o.lines[k].received) > 0.0001; });
        o.status = left ? "part" : "received";
        return o;
      });
      if(!res.committed) throw new Error("The order didn't update — check your connection.");
    }
    // learn the delivery note wording for next time (Stock In uses the same memory)
    var upd = { board:{}, consumables:{} };
    items.forEach(function(x){ var s = x.newStock || x.stock; if(!s || !x.src || !x.src.text) return; var k = L.aliasKey(x.src);
      if(k) upd[x.t][fbKey(k)] = { itemId:s.replace(/^[bc]:/, ""), text:String(x.src.text).slice(0,160) }; });
    for(var t in upd) if(Object.keys(upd[t]).length) await db.ref("stockIn/aliases/" + t).update(upd[t]);
    await db.ref("stockIn/receipts/" + did).set({ ts:ts, user:who, target: items.every(function(x){ return x.t === "board"; }) ? "board" : "consumables", location:loc, supplier:r.supplier,
      docRef:(r.docRef || "") + (refs ? " · order " + refs : ""), fileName: r.file ? r.file.name : "", fileUrl:fileUrl,
      lines: items.filter(function(x){ return x.t; }).map(function(x){ return { item:stockLabel({ stock:x.newStock || x.stock, nf:x.nf }), qty:x.qty, unit:unitOf(x.c.line) }; }) });
    toast("Received " + items.length + " line" + (items.length===1?"":"s") + " — stock updated.", "ok");
    var single = Object.keys(byOrder).length === 1 ? Object.keys(byOrder)[0] : null;
    rcv = null; ui.view = single ? "order" : "list"; ui.orderId = single;
  }catch(e){ console.warn(e); toast("Couldn't save: " + (e.message || e), "err"); }
  busy = false; render();
}
async function setStatus2(o, status, extra){
  if(!freshUser()) return;
  var u = Object.assign({ status:status }, extra || {});
  try{ await db.ref("orders/list/" + o.id).update(u); toast("Saved.", "ok"); }catch(e){ toast("Couldn't save: " + (e.message || e), "err"); }
}

// ---------- events ----------
function editOrder(o){
  draft = o ? { id:o.id, supplier:o.supplier||"", supplierEmail:o.supplierEmail||"", ref:o.ref||"", status:o.status === "quote" ? "quote" : "ordered", quoteDate:o.quoteDate, orderedDate:o.orderedDate,
    location:o.location || locationsAll()[0], notes:o.notes||"", quoteUrl:o.quoteUrl||"", quoteFile:o.quoteFile||"", file:null,
    lines: orderLines(o).map(function(l){ return { key:++seq, lid:l.lid, text:l.text||"", code:l.code||"", desc:l.desc||"", size:l.size||"", qty:num(l.qty), received:num(l.received), stock:l.stock||"", nf:l.nf||null, per:l.per||"", how:"picked", score:1 }; }) }
    : { supplier:"", supplierEmail:"", ref:"", status:"ordered", orderedDate:today(), quoteDate:today(), location:ui.loc || locationsAll()[0], notes:"", file:null, lines:[] };
  ui.view = "edit"; render(); window.scrollTo(0, 0);
}
function readDraftFields(){
  var g = function(id){ var e = document.getElementById(id); return e ? e.value : undefined; };
  if(!draft) return;
  if(g("dSup") !== undefined) draft.supplier = g("dSup");
  if(g("dEmail") !== undefined) draft.supplierEmail = g("dEmail").trim();
  if(g("dRef") !== undefined) draft.ref = g("dRef").trim();
  if(g("dQDate") !== undefined) draft.quoteDate = g("dQDate");
  if(g("dODate") !== undefined) draft.orderedDate = g("dODate");
  if(g("dLoc") !== undefined) draft.location = g("dLoc");
  if(g("dNotes") !== undefined) draft.notes = g("dNotes");
}
function bindFileInputs(onFile){
  var q = function(s){ return document.querySelector(s); };
  var fi = q("#fileIn"), ci = q("#camIn");
  if(q("#pick")) q("#pick").onclick = function(e){ e.stopPropagation(); fi.click(); };
  if(q("#snap")) q("#snap").onclick = function(e){ e.stopPropagation(); ci.click(); };
  [fi, ci].forEach(function(inp){ if(inp) inp.onchange = function(){ if(inp.files[0]) onFile(inp.files[0]); inp.value = ""; }; });
  var dz = q("#drop");
  if(dz){
    dz.onclick = function(){ fi.click(); };
    dz.ondragover = function(e){ e.preventDefault(); dz.classList.add("over"); };
    dz.ondragleave = function(){ dz.classList.remove("over"); };
    dz.ondrop = function(e){ e.preventDefault(); dz.classList.remove("over"); var f = e.dataTransfer.files[0]; if(f) onFile(f); };
  }
}
function bind(){
  var q = function(s){ return document.querySelector(s); }, qa = function(s){ return document.querySelectorAll(s); };
  if(q("#back")) q("#back").onclick = function(){
    if(ui.view === "edit" && draft && draft.lines.length && !confirm("Leave without saving?")) return;
    if(ui.view === "receive" && rcv && rcv.lines.length && !confirm("Leave without receiving?")) return;
    var backTo = (ui.view === "edit" && draft && draft.id) ? "order" : (ui.view === "receive" && rcv && rcv.orderId) ? "order" : "list";
    if(ui.view === "receive" && rcv && rcv.orderId) ui.orderId = rcv.orderId;
    draft = null; rcv = null; ui.view = backTo; render();
  };
  // list
  if(q("#newOrder")) q("#newOrder").onclick = function(){ editOrder(null); };
  if(q("#rcvAny")) q("#rcvAny").onclick = function(){ startReceive("", null); };
  if(q("#addLoc")) q("#addLoc").onclick = async function(){ var n = await addLocationFlow(); if(n){ setLoc(n); render(); } };
  qa("[data-loc]").forEach(function(b){ b.onclick = function(){ setLoc(b.getAttribute("data-loc")); render(); }; });
  qa("[data-filter]").forEach(function(b){ b.onclick = function(){ ui.filter = b.getAttribute("data-filter"); render(); }; });
  if(q("#search")) q("#search").oninput = function(){ ui.search = this.value; var pos = this.selectionStart; render(); var s = q("#search"); s.focus(); try{ s.setSelectionRange(pos, pos); }catch(e){} };
  qa("[data-open]").forEach(function(c){ c.onclick = function(){ ui.orderId = c.getAttribute("data-open"); ui.view = "order"; render(); window.scrollTo(0, 0); }; });
  // order detail
  var o = ui.view === "order" ? D.orders[ui.orderId] : null;
  if(o){
    o.id = ui.orderId;
    if(q("#placeOrder")) q("#placeOrder").onclick = function(){ var d = (q("#placeDate") || {}).value || today(); setStatus2(o, "ordered", { orderedDate:d }); };
    if(q("#rcvThis")) q("#rcvThis").onclick = function(){ startReceive(o.supplier, o.id); };
    if(q("#editOrder")) q("#editOrder").onclick = function(){ editOrder(o); };
    if(q("#closeOrder")) q("#closeOrder").onclick = function(){ if(confirm("Close this order? The " + orderOut(o) + " item(s) still to come are marked as not coming and it drops off the Monday/Wednesday check.")) setStatus2(o, "closed", { closedBy:user.username, closedAt:new Date().toISOString() }); };
    if(q("#reopen")) q("#reopen").onclick = function(){ setStatus2(o, list(o.deliveries).length ? "part" : "ordered"); };
    if(q("#delOrder")) q("#delOrder").onclick = async function(){ if(!confirm("Delete this " + (o.status === "quote" ? "quote" : "order") + "? Stock already received stays in stock.")) return;
      if(!freshUser()) return; try{ await db.ref("orders/list/" + o.id).remove(); ui.view = "list"; toast("Deleted.", "ok"); render(); }catch(e){ toast("Couldn't delete: " + (e.message || e), "err"); } };
  }
  // edit
  if(ui.view === "edit" && draft){
    ["dSup","dEmail","dRef","dQDate","dODate","dLoc","dNotes"].forEach(function(id){ var e = q("#" + id); if(e) e.onchange = e.oninput = readDraftFields; });
    if(q("#dLoc")) q("#dLoc").onchange = async function(){
      if(this.value !== "__add"){ readDraftFields(); return; }
      var keep = draft.location; readDraftFields(); draft.location = keep;
      var n = await addLocationFlow(); if(n) draft.location = n; render(); };
    if(q("#dSup")) q("#dSup").onchange = function(){ readDraftFields(); var s = allSuppliers().find(function(x){ return x.name.toLowerCase() === draft.supplier.trim().toLowerCase(); }); if(s && s.email && !draft.supplierEmail){ draft.supplierEmail = s.email; } render(); };
    qa("[data-supto]").forEach(function(b){ b.onclick = function(){ readDraftFields(); draft.newSupTo = b.getAttribute("data-supto"); render(); }; });
    qa("[data-st]").forEach(function(b){ b.onclick = function(){ readDraftFields(); draft.status = b.getAttribute("data-st"); render(); }; });
    bindFileInputs(function(f){ readDraftFields(); draft.file = f; readInto(f, function(raw){ var said = applyDraftDoc(); addDraftLines(raw, "file"); if(said.length) setTimeout(function(){ toast("Read " + said.join(" and ") + " from the document.", "ok"); }, 1800); }); });
    if(q("#pasteGo")) q("#pasteGo").onclick = function(){ readDraftFields(); addDraftLines(L.linesFromText(q("#pasteIn").value), "pasted text"); render(); };
    if(q("#addBlank")) q("#addBlank").onclick = function(){ readDraftFields(); draft.lines.push({ key:++seq, text:"", code:"", desc:"", size:"", qty:0, received:0, stock:"", how:"picked", score:1 }); render(); };
    qa("[data-stock]").forEach(function(s){ s.onchange = function(){ readDraftFields(); var l = draftLine(s.getAttribute("data-stock")); l.stock = s.value; l.how = "picked"; l.score = 1;
      if(l.stock === "new:board" && !l.nf) l.nf = { description:l.desc || l.text || "", category:l.size || "" };
      if(l.stock === "new:cons" && !l.nf) l.nf = { name:(l.desc || l.text || "").replace(/\s+/g, " ").trim(), unit:"each" };
      l.per = guessPer(l);
      render(); }; });
    qa("[data-per]").forEach(function(sel){ sel.onchange = function(){ draftLine(sel.getAttribute("data-per")).per = sel.value; }; });
    qa("[data-qty]").forEach(function(inp){ inp.oninput = function(){ draftLine(inp.getAttribute("data-qty")).qty = num(inp.value); }; inp.onchange = function(){ readDraftFields(); render(); }; });
    qa("[data-text]").forEach(function(inp){ inp.oninput = function(){ draftLine(inp.getAttribute("data-text")).desc = inp.value; }; });
    qa("[data-del]").forEach(function(b){ b.onclick = function(){ readDraftFields(); draft.lines = draft.lines.filter(function(l){ return String(l.key) !== b.getAttribute("data-del"); }); render(); }; });
    qa("[data-nf]").forEach(function(inp){ var h = function(){ var l = draftLine(inp.getAttribute("data-nf")); l.nf = l.nf || {}; l.nf[inp.getAttribute("data-f")] = inp.value.trim(); return l; }; inp.oninput = h;
      inp.onchange = function(){ var l = h(); if(inp.tagName === "SELECT" || inp.getAttribute("data-f") === "bundle"){ if(!l.per) l.per = guessPer(l); readDraftFields(); render(); } }; });
  }
  // receive
  if(ui.view === "receive" && rcv){
    if(q("#rSup")) q("#rSup").onchange = function(){ if(rcv.lines.length && !confirm("Changing supplier clears the lines below. Carry on?")){ this.value = rcv.supplier; return; } rcv.supplier = this.value; rcv.orderId = null; rcv.lines = [];
      if(rcv.supplier && rcv.pending){ var p = rcv.pending; rcv.pending = null; addRcvLines(p, "delivery note"); }
      render(); };
    if(q("#rLoc")) q("#rLoc").onchange = function(){
      if(rcv.lines.length && !rcv.orderId && !confirm("Changing location clears the lines below. Carry on?")){ this.value = rcv.location; return; }
      rcv.location = this.value; if(!rcv.orderId){ rcv.lines = []; if(!openLinesFor(rcv.supplier).length) rcv.supplier = ""; } render(); };
    if(q("#rRef")) q("#rRef").oninput = function(){ rcv.docRef = this.value.trim(); };
    if(q("#allOrders")) q("#allOrders").onclick = function(){ rcv.orderId = null; render(); };
    bindFileInputs(function(f){ rcv.file = f; readInto(f, function(raw){ rcvDoc(raw); }); });
    if(q("#allCame")) q("#allCame").onclick = function(){ if(rcv.lines.length && !confirm("Replace the lines below with everything still to come?")) return; fillAllOutstanding(); render(); };
    if(q("#addBlank")) q("#addBlank").onclick = function(){ rcv.lines.push({ key:++seq, src:{ text:"" }, qty:0, match:"", how:"picked", score:1 }); render(); };
    qa("[data-rmatch]").forEach(function(s){ s.onchange = function(){ var l = rcvLine(s.getAttribute("data-rmatch")); l.match = s.value; l.how = "picked"; l.skip = !s.value;
      if(l.match && !num(l.qty)){ var c = openLinesFor(rcv.supplier, rcv.orderId).find(function(x){ return x.id === l.match; }); if(c) l.qty = outstanding(c.line); }
      render(); }; });
    qa("[data-rqty]").forEach(function(inp){ inp.oninput = function(){ var l = rcvLine(inp.getAttribute("data-rqty")); l.qty = num(inp.value); if(l.qty > 0 && l.match) l.skip = false; }; inp.onchange = function(){ render(); }; });
    qa("[data-rdel]").forEach(function(b){ b.onclick = function(){ rcv.lines = rcv.lines.filter(function(l){ return String(l.key) !== b.getAttribute("data-rdel"); }); render(); }; });
  }
}
function draftLine(k){ return draft.lines.find(function(l){ return String(l.key) === String(k); }); }
function rcvLine(k){ return rcv.lines.find(function(l){ return String(l.key) === String(k); }); }
document.getElementById("commit").onclick = function(){
  if(busy) return;
  if(ui.view === "edit" && draft){ readDraftFields(); saveDraft(); }
  else if(ui.view === "receive" && rcv) saveReceive();
};

// ---------- start ----------
var started = false;
function start(){
  if(started) return; started = true;
  db = firebase.database();
  var rr = function(){ if(!busy) render(); };
  db.ref("boardStock").on("value", function(s){ D.board = s.val() || { boards:[], locations:["Main"] }; rr(); });
  ["screwItems","consumableTypes","suppliers","meta"].forEach(function(k){
    db.ref("consumablesStock/" + k).on("value", function(s){ D.cons[{ screwItems:"items", consumableTypes:"types", suppliers:"suppliers", meta:"meta" }[k]] = s.val() || {}; rr(); });
  });
  db.ref("stockIn/aliases").on("value", function(s){ D.aliases = s.val() || {}; });
  db.ref("orders/list").on("value", function(s){ D.orders = s.val() || {}; D.loaded = true;
    // don't redraw under someone typing in a form
    if(ui.view === "list" || ui.view === "order") rr(); });
  var h = (location.hash || "").slice(1);
  if(h.indexOf("order=") === 0){ ui.view = "order"; ui.orderId = decodeURIComponent(h.slice(6)); }
  render();
}
try{
  core.init();
  core.startUsersSync(function(users){
    var r = S.resolve(users);
    if(r.status === "wait") return;
    if(r.status !== "ok"){ S.goHome({ next:"orders" }); return; }
    user = r.user;
    document.getElementById("who").textContent = user.username;
    start();
    if(!busy && (ui.view === "list" || ui.view === "order")) render();
  });
}catch(e){
  document.getElementById("app").innerHTML = '<div class="card"><h2>Could not start</h2><p class="muted">' + esc(e.message || String(e)) + '</p></div>';
}
if(!S.get()) S.goHome({ next:"orders" });
})();
</script>
