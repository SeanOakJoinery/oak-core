<style>

:root{--bg:#1E1C18;--panel:#26221C;--panel-2:#2E2A22;--text:#EFE8D8;--muted:#9C9280;--amber:#E3A23A;--amber-dim:#3B2E1A;--line:#433D32;--green:#5FA76E;--green-dim:#1F3325;--rust:#C46A4A;--rust-dim:#3A231B;
  --font-b:"Inter",system-ui,-apple-system,sans-serif;--font-m:"Space Grotesk","Inter",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:calc(14px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:8px}
.brand .t{font-family:var(--font-m);font-weight:600;font-size:18px}
.brand .s{font-size:12px;color:var(--muted)}
h2{font-family:var(--font-m);font-weight:600;font-size:17px;margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--amber-dim);color:var(--amber);font-size:12px;font-weight:600;margin-right:8px;vertical-align:1px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.seg button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px 10px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{border-color:var(--amber);background:var(--amber-dim);color:var(--amber)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 11px;font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber)}
textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text);text-decoration:none}
.btn-primary{background:var(--amber);border-color:var(--amber);color:#1E1C18}
.btn-sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--amber);background:var(--amber-dim)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{color:var(--amber);border-color:var(--amber)}
.status{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px}
.bar{height:4px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .2s}
.lines{display:grid;gap:10px}
.line{background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px}
.line.ok{border-left-color:var(--green)}
.line.check{border-left-color:var(--amber)}
.line.new{border-left-color:#6FA0C8}
.line.skip{opacity:.55}
.line .src{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);word-break:break-word;margin-bottom:6px}
.line .lrow{display:grid;grid-template-columns:1fr 92px 34px;gap:8px;align-items:center}
.line .unit{font-size:12px;color:var(--muted)}
.line .x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.line .newf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.line .newf label{margin:0 0 3px}
.tag{font-size:11px;border-radius:99px;padding:2px 8px;margin-left:6px}
.tag.ok{background:var(--green-dim);color:var(--green)}.tag.check{background:var(--amber-dim);color:var(--amber)}.tag.new{background:#1C2A36;color:#8FB9DB}
.sum{position:fixed;left:0;right:0;bottom:0;background:rgba(30,28,24,.96);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
.sum .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.hist{list-style:none;margin:0;padding:0}
.hist li{border-top:1px solid var(--line);padding:9px 0;font-size:13px}
.hist li:first-child{border-top:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);padding:10px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:50}
.toast.show{opacity:1}.toast.err{border-color:var(--rust)}.toast.ok{border-color:var(--green)}
.empty{padding:14px;text-align:center;color:var(--muted);font-size:13px}
.hide{display:none!important}

.olist{display:grid;gap:10px}
.ord{background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}
.ord:hover{border-color:var(--amber)}
.ord.late{border-left-color:var(--rust)}
.ord.part{border-left-color:var(--amber)}
.ord.done{border-left-color:var(--green);opacity:.8}
.ord.quote{border-left-color:#6FA0C8}
.ord .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ord .h b{font-size:15px}
.pill{font-size:11px;border-radius:99px;padding:2px 8px;white-space:nowrap}
.pill.quote{background:#1C2A36;color:#8FB9DB}.pill.ordered{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.pill.part{background:var(--amber-dim);color:var(--amber)}.pill.received{background:var(--green-dim);color:var(--green)}
.pill.late{background:var(--rust-dim);color:#E39A80}.pill.closed{background:var(--panel);color:var(--muted)}
.prog{height:5px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--green)}
table.ol{width:100%;border-collapse:collapse;font-size:14px}
table.ol th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:6px 6px;border-bottom:1px solid var(--line)}
table.ol td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.ol td.n{text-align:right;white-space:nowrap}
table.ol tr.out td.n.o{color:var(--amber);font-weight:600}
table.ol tr.full td{color:var(--muted)}
.alert{border-color:var(--rust)}
.alert h2{color:#E39A80}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.backlink{background:none;border:none;color:var(--amber);font:inherit;cursor:pointer;padding:0;margin-bottom:10px}
.line .lrow.r{grid-template-columns:1fr 92px 34px}
.sub{font-size:12px;color:var(--muted);margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-family:var(--font-m);font-size:22px}.stats span{font-size:12px;color:var(--muted)}
.tlist{display:grid;gap:10px}
.tool{display:flex;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:8px;padding:10px 12px}
.tool.out{border-left-color:var(--amber)}.tool.repair{border-left-color:var(--rust)}
.tool .info{flex:1;cursor:pointer;min-width:0}.tool .h{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.pill.in{background:var(--green-dim);color:var(--green)}.pill.out{background:var(--amber-dim);color:var(--amber)}.pill.repair{background:var(--rust-dim);color:#E39A80}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.check{border:1px solid var(--amber);background:var(--amber-dim);border-radius:10px;padding:12px;margin:10px 0}
.check .ct{font-family:var(--font-m);font-weight:600;font-size:16px;margin-bottom:4px}
.tick{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:15px;font-weight:600;color:var(--text)}
.tick input{width:22px;height:22px;accent-color:var(--amber)}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
/* projects */
.pjlist{display:grid;gap:10px}
.pj{background:var(--panel-2);border:1px solid var(--line);border-left:4px solid #6FA0C8;border-radius:8px;padding:12px;cursor:pointer}
.pj:hover{border-color:var(--amber)}
.pj.st-production{border-left-color:var(--amber)}.pj.st-installing{border-left-color:#B48CD8}.pj.st-complete{border-left-color:var(--green);opacity:.85}.pj.st-hold{border-left-color:var(--muted)}
.pj .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.pill.planning{background:#1C2A36;color:#8FB9DB}.pill.production{background:var(--amber-dim);color:var(--amber)}.pill.installing{background:#2A2236;color:#C9A8E8}
.pill.complete{background:var(--green-dim);color:var(--green)}.pill.hold{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.tabs.sub{margin:4px 0 12px}
.stg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.wrap{max-width:1180px}
.sbtn{display:inline-flex;gap:2px;align-items:center;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.sbtn:not(:disabled):hover{border-color:var(--amber)}.sbtn:disabled{cursor:default}
.sbtn.s-doing{color:#F0B85A;border-color:#E0A33A;background:rgba(224,163,58,.14)}
.sbtn.s-done{color:#8FCB7A;border-color:#4F7A45;background:rgba(79,122,69,.22)}
.sbtn.s-skip{opacity:.45}
.cnt{font-size:12px;display:flex;gap:10px;flex-wrap:wrap}.cnt b{font-weight:600}.cnt .s-done{color:#8FCB7A}.cnt .s-doing{color:#F0B85A}.cnt .s-todo{color:var(--muted)}
table.pg2{min-width:760px}table.pg2 td{vertical-align:middle}.mini.late{color:#E39A80}
@media(max-width:700px){.sbtn span{display:none}.sbtn{padding:5px 10px;font-size:15px}table.pg2{min-width:520px}}
table.bd{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
table.bd th{text-align:left;font-size:11px;color:var(--muted);font-weight:500;padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.bd td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.bd input[type=date]{width:118px;padding:3px 4px;font-size:12px}
table.bd .done{color:var(--green)}
.cell{display:flex;flex-direction:column;gap:3px}
.cell label{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);margin:0}
.cell label input{width:auto;margin:0}
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.gantt .g{display:grid;min-width:max-content}
.gantt .gh{position:sticky;top:0;background:var(--panel);font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);padding:4px 0;text-align:center;border-left:1px solid var(--line)}
.gantt .gl{position:sticky;left:0;background:var(--panel-2);padding:6px 8px;font-size:13px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.gantt .gl.p{font-weight:600;cursor:pointer}.gantt .gl.a{padding-left:20px;color:var(--muted);font-size:12px}
.gantt .gc{border-bottom:1px solid var(--line);border-left:1px solid rgba(255,255,255,.04);position:relative;min-height:28px}
.gantt .bar{position:absolute;top:7px;height:14px;border-radius:4px;opacity:.9}
.gantt .today{background:rgba(224,163,58,.10)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}
.dwg{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.dwg .h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.mini{font-size:12px;color:var(--muted)}
.tot{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin:8px 0}
.tot b{font-family:var(--font-m);font-size:16px}

@page{size:A4;margin:11mm}

@media print{
  html,body{background:#fff!important;color:#111!important}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  #printArea.land{page:land}
  #printArea{font:10pt/1.35 Arial,Helvetica,sans-serif;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}

  #printArea .pb{font-size:8pt;letter-spacing:2px;font-weight:700;color:#8a6a2a}

  #printArea table{width:100%;border-collapse:collapse;margin-bottom:6px}
  #printArea tr{break-inside:avoid}
  #printArea .pg th{font-size:8pt;text-align:left;background:#eee;border:1px solid #bbb;padding:3px 4px}
  #printArea .pg td{border:1px solid #bbb;padding:3px 4px;font-size:9pt;vertical-align:top}
  #printArea .pg th i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle}
  #printArea .pk td{padding:3px 6px;border:1px solid #ccc;font-size:9.5pt;vertical-align:top}
  #printArea .pk td:nth-child(odd){background:#f3f3f3;color:#444;width:16%;font-size:8.5pt}
  #printArea .pa{width:22%}#printArea .pq{width:5%;text-align:center}#printArea .pr{text-align:right;white-space:nowrap}
  #printArea .pdn{background:#e3efdf}#printArea .pdo{background:#fbeccc}
  #printArea .pdw{margin:8px 0 3px;break-after:avoid}
  #printArea .pm{color:#555;font-size:8.5pt}
  #printArea .ptot{text-align:right;margin:2px 0 0}
  #printArea .pdi{border-bottom:1px solid #ddd;padding:4px 0;break-inside:avoid}#printArea .pdi img{max-width:60mm;max-height:45mm;margin-top:3px}
  #printArea .pl{display:flex;flex-wrap:wrap;gap:10px;font-size:8pt;margin:0 0 6px}#printArea .pl i{display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle}
  #printArea .gtab{table-layout:fixed}
  #printArea .gtab th{font-size:8pt;text-align:left;border-bottom:1px solid #888;padding:2px 4px}
  #printArea .gtab th:first-child,#printArea .gtab td:first-child{width:52mm}
  #printArea .gtab td{border-bottom:1px solid #ddd;padding:2px 4px;font-size:8.5pt;vertical-align:middle}
  #printArea .gtab tr.gj td{border-top:1px solid #999;font-weight:700}
  #printArea .gtab td.ga{padding-left:10px;color:#444;font-weight:400}
  #printArea .gh{position:relative;height:12px;padding:0!important}#printArea .gh span{position:absolute;top:0;padding-left:2px;font-weight:400;border-left:1px solid #888}
  #printArea td.gc{position:relative;height:16px;padding:0!important}
  #printArea .gw{position:absolute;top:0;bottom:0;border-left:1px solid #e2e2e2}
  #printArea .gt{position:absolute;top:0;bottom:0;background:#fbeccc}
  #printArea .gb{position:absolute;top:4px;height:9px;border-radius:2px}
  #printArea tr.gj .gb{top:3px;height:11px}
  #printArea .gd{position:absolute;top:1px;bottom:1px;width:2px;margin-left:-1px;background:#D0603F}
}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="../icon-192.png" alt=""><div><div class="t" id="apptitle">Projects</div><div class="s" id="who">Oak Joinery</div></div></div>
    <a class="btn btn-sm" href="../">☰ Menu</a>

  <main id="app"><div class="card muted">Loading…</div></main>
</div>
<div id="modal" class="hide"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

<script>
/* Oak Joinery — Firebase sign-in guard (v2, 2026-10-10: PIN lock).
   Every app signs in to Firebase anonymously in the background, and every
   database call (on / once / set / update / push / remove / transaction)
   waits until that sign-in has finished.
   PIN lock: once signed in, if someone is logged in on this device (the
   shared Oak session: user id + PIN hash), this device is registered under
   oakSessions/<its Firebase id>. The database rules only let a device read or
   write when that registration matches the user's PIN in the locked pins/
   store — so an outsider who only has the app's public key gets nothing.
   If the registration is refused (PIN changed, user removed) the person is
   sent back to the menu to log in again. If anonymous sign-in fails or takes
   too long, the calls carry on as before. */
(function(){
  "use strict";
  if (window.__oakAuthGuard || !window.firebase || !firebase.database) return;
  window.__oakAuthGuard = 2;
  var state = {};   // app name -> { ready, queue }
  var set0 = null;  // the real Reference.set (before it is made to wait)
  function appOf(ref){
    try { return (ref && ref.database && ref.database.app) || firebase.app(); } catch (e) { return null; }
  }
  function slot(app){
    var n = app ? app.name : "[DEFAULT]";
    if (!state[n]) { state[n] = { ready:false, queue:[] }; signIn(app, state[n]); }
    return state[n];
  }
  function release(s){
    if (s.ready) return; s.ready = true;
    var q = s.queue; s.queue = [];
    q.forEach(function(f){ try { f(); } catch (e) { console.error(e); } });
  }
  function localSession(){
    try { var x = JSON.parse(localStorage.getItem("oakSession")); return x && x.id && x.pin && x.exp && Date.now() < x.exp ? x : null; } catch (e) { return null; }
  }
  function denied(e){ return /permission/i.test(String((e && (e.code || e.message)) || e)); }
  function rejected(){
    try { localStorage.removeItem("oakSession"); } catch (e) {}
    try { window.dispatchEvent(new Event("oak-session-rejected")); } catch (e) {}
    if (!/\/oak-core\/?(index\.html)?$/.test(location.pathname)) location.href = "/oak-core/?logout=1";
  }
  // Register this device's sign-in for the logged-in person, then let the queued calls go.
  function register(app, u, s){
    var x = localSession();
    if (!x || !set0) { release(s); return; }
    var done = false, t = setTimeout(function(){ if (!done) { done = true; release(s); } }, 8000);

<script src="../oak-core.js?v=4"></script>
<script>
(function(){
"use strict";
// Oak Joinery — Projects & Clients (2026-10-16).

var S = OakCore.session, esc = OakCore.esc;
var core = OakCore.createApp({ appId: "projects", readOnly: true });
var db = null, user = null, busy = false;
var D = { projects:{}, materials:{}, clients:{}, board:null, cons:{ items:{}, types:{}, meta:{} }, notes:[], orders:{} };
var ui = { view:"list", tab:(location.hash === "#clients" ? "clients" : "projects"), ptab:"overview", pid:null, cid:null, search:"", status:"active", tlStart:null, open:{} };

var STAGES = [
  { k:"cutting",  t:"Cutting",            c:"#6FA0C8" },
  { k:"edging",   t:"Edging",             c:"#5FB3A6" },
  { k:"assembly", t:"Assembly",           c:"#E0A33A" },
  { k:"spraying", t:"Spraying / finishing", c:"#C98A6B" },
  { k:"dispatch", t:"Dispatch / delivery",  c:"#9BBF6A" },
  { k:"install",  t:"Site installation",  c:"#B48CD8" }
];

var MTYPES = [["board","Board"],["solid","Solid wood"],["cons","Consumable / hardware"],["stone","Stone / tops"],["bought","Bought-in item"]];

function toast(msg, kind){ var t = document.getElementById("toast"); t.textContent = msg; t.className = "toast show " + (kind||""); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.className = "toast"; }, 3600); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function num(v){ var n = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isFinite(n) ? n : 0; }
function r3(n){ return Math.round((Number(n) || 0) * 1000) / 1000; }
function list(v){ return v && typeof v === "object" ? Object.keys(v).map(function(k){ var x = v[k]; if(x && typeof x === "object"){ x.id = k; return x; } return null; }).filter(Boolean) : []; }
function arr(v){ return Array.isArray(v) ? v.filter(function(x){ return x != null; }) : list(v); }
function fbKey(s){ return String(s).replace(/[.#$\[\]\/]/g, "_"); }
function today(){ var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function fmtD(s){ if(!s) return "—"; var d = new Date(s + (s.length === 10 ? "T00:00:00" : "")); return isNaN(d) ? s : d.toLocaleDateString("en-ZA", { day:"2-digit", month:"short", year:"numeric" }); }
function money(n){ n = Number(n) || 0; return "R " + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function perm(k){ return !!(user && (core.isMainRoot(user) || user.isRoot || (user.permissions && user.permissions[k]))); }
function canEdit(){ return perm("projectsEdit"); }
function canMat(){ return perm("projectsMaterials"); }
function canClients(){ return perm("clientsEdit"); }
function hasProjects(){ return core.userHasApp(user, "projects"); }
function hasClients(){ return core.userHasApp(user, "clients"); }
function freshUser(){ var f = S.resolve(core.getUsers()); if(f.status !== "ok"){ S.goHome({ next:"projects" }); return null; } user = f.user; return user; }
function locations(){ var a = (D.board && D.board.locations) || [], b = (D.cons.meta && D.cons.meta.locations) || [], out = [];
  a.concat(b).forEach(function(l){ if(l && out.indexOf(l) < 0) out.push(l); }); return out.length ? out : ["Main"]; }
function projects(){ return list(D.projects).sort(function(a,b){ return String(b.jobNo||"").localeCompare(String(a.jobNo||""), undefined, { numeric:true }) || String(a.name).localeCompare(String(b.name)); }); }
function clients(){ return list(D.clients).sort(function(a,b){ return String(a.name).localeCompare(String(b.name)); }); }
function clientName(id){ var c = D.clients[id]; return c ? c.name : ""; }
function pLabel(p){ return (p.jobNo ? p.jobNo + " · " : "") + (p.name || "Untitled job"); }
function statusPill(s){ var st = STATUS.find(function(x){ return x[0] === s; }) || STATUS[0]; return '<span class="pill ' + st[0] + '">' + st[1] + '</span>'; }
function drawings(p){ return list(p && p.drawings).sort(function(a,b){ return String(a.no||"").localeCompare(String(b.no||""), undefined, { numeric:true }); }); }
function assemblies(d){ return list(d && d.assemblies).sort(function(a,b){ return (Number(a.n)||0) - (Number(b.n)||0); }); }
function mats(pid){ return list(D.materials[pid]).sort(function(a,b){ return String(b.ts).localeCompare(String(a.ts)); }); }
// the planned span of a job / assembly from its stage dates
function spanOf(stages){ var s = null, e = null; STAGES.forEach(function(st){ var x = stages && stages[st.k]; if(!x) return;
  [x.start, x.end].forEach(function(v){ if(!v) return; if(!s || v < s) s = v; if(!e || v > e) e = v; }); }); return { s:s, e:e }; }
// Job programme (2026-10-17): quote → design → fabrication → install → handover, planned per job
var PLAN = [
  { k:"quote",    t:"Quote",              one:true },
  { k:"design",   t:"Design",             c:"#8C8CB8" },
  { k:"approval", t:"Design approval",    one:true },
  { k:"fab",      t:"Fabrication start",  one:true },
  { k:"cutting",  t:"Cutting",            c:"#6FA0C8" },
  { k:"edging",   t:"Edging",             c:"#5FB3A6" },
  { k:"mfg",      t:"Manufacturing",      c:"#E0A33A" },
  { k:"install",  t:"Installation",       c:"#B48CD8" },
  { k:"handover", t:"Handover",           one:true }
];
var PLAN_LANES = PLAN.filter(function(x){ return !x.one; });
function hasPlan(p){ return !!(p && p.plan && PLAN.some(function(x){ var v = p.plan[x.k]; return x.one ? !!v : !!(v && (v.start || v.end)); })); }

  return { s:s, e:e }; }
// ---- part progress (2026-10-17): every stage of every part is To do → In progress → Done (or Not needed) ----
function stStatus(x){ return !x ? "todo" : x.skip ? "skip" : x.done ? "done" : x.prog === "doing" ? "doing" : "todo"; }

function countParts(as){ var c = { todo:0, doing:0, done:0, skip:0 }; as.forEach(function(a){ STAGES.forEach(function(st){ c[stStatus(a.stages && a.stages[st.k])]++; }); });
  c.total = c.todo + c.doing + c.done; c.pct = c.total ? Math.round(c.done / c.total * 100) : 0; return c; }
function jobCounts(p){ var all = []; drawings(p).forEach(function(d){ all = all.concat(assemblies(d)); }); return countParts(all); }
function progress(p){ return jobCounts(p).pct; }
function canProg(){ return perm("projectsProgress") || canEdit(); }
function countsHtml(c){ return '<span class="cnt"><b class="s-done">● ' + c.done + ' done</b> <b class="s-doing">◐ ' + c.doing + ' in progress</b> <b class="s-todo">○ ' + c.todo + ' to do</b>' + (c.skip ? ' <span class="mini">· ' + c.skip + ' not needed</span>' : '') + '</span>'; }
function statusBtn(p, d, a, st){
  var x = (a.stages && a.stages[st.k]) || {}, s = stStatus(x), path = [p.id, d.id, a.id, st.k].join("|");
  var who = s === "done" && x.done ? " — " + (x.done.by || "") + " " + fmtD(String(x.done.at || "").slice(0, 10)) : s === "doing" && x.progBy ? " — started by " + x.progBy + " " + fmtD(String(x.progAt || "").slice(0, 10)) : "";
  return '<button type="button" class="sbtn s-' + s + '" data-sst="' + esc(path) + '"' + (canProg() && s !== "skip" ? "" : " disabled") + ' title="' + esc(st.t + ": " + SLABEL[s] + who + (canProg() && s !== "skip" ? " (tap to change)" : "")) + '">' + SICON[s] + '<span> ' + SLABEL[s] + '</span></button>';
}
// Dispatch delivery notes and Orders POs that belong to a job (matched on job number or job name)
function matchesJob(p, text){ text = String(text || "").toLowerCase(); if(!text) return false;
  if(p.jobNo && text.indexOf(String(p.jobNo).toLowerCase()) >= 0) return true;
  var n = String(p.name || "").toLowerCase().trim(); return n.length >= 4 && text.indexOf(n) >= 0; }
function jobNotes(p){ return D.notes.filter(function(n){ return n && (matchesJob(p, n.customer) || arr(n.items).some(function(i){ return matchesJob(p, i && i.ref); })); })
  .sort(function(a,b){ return String(b.number||"").localeCompare(String(a.number||"")); }); }
function jobOrders(p){ return list(D.orders).filter(function(o){ return o && ((p.jobNo && String(o.jobNo||"").trim().toLowerCase() === String(p.jobNo).trim().toLowerCase()) || matchesJob(p, o.notes) || list(o.lines).some(function(l){ return l.forJob === p.id; })); })
  .sort(function(a,b){ return String(b.orderedDate||"").localeCompare(String(a.orderedDate||"")); }); }

// ---------- modal ----------
function openModal(html){ var m = document.getElementById("modal"); m.innerHTML = '<div class="mbg"><div class="mbox" style="max-width:560px">' + html + '</div></div>'; m.classList.remove("hide"); }
function closeModal(){ var m = document.getElementById("modal"); m.innerHTML = ""; m.classList.add("hide"); if(render.pending){ render.pending = false; render(); } }
function q(s){ return document.querySelector(s); }
function qa(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function val(id){ var e = document.getElementById(id); return e ? String(e.value || "").trim() : ""; }

// ---------- views ----------
function render(){
  var root = document.getElementById("app");
  if(!user) return;
  if(!hasProjects() && !hasClients()){ root.innerHTML = '<div class="card"><h2>No access</h2><p class="muted">Ask Sean to tick "Projects" or "Clients" for you in the Users app.</p><a class="btn" href="../">Back to menu</a></div>'; return; }
  if(!hasProjects()) ui.tab = "clients";
  document.getElementById("apptitle").textContent = ui.tab === "clients" && ui.view !== "project" ? "Clients" : "Projects";
  if(ui.view === "project" && D.projects[ui.pid] && hasProjects()){ root.innerHTML = viewProject(D.projects[ui.pid]); bind(); return; }
  if(ui.view === "client" && D.clients[ui.cid]){ root.innerHTML = viewClient(D.clients[ui.cid]); bind(); return; }
  ui.view = "list";
  var tabs = (hasProjects() ? [["projects","Projects"],["timeline","Timeline"]] : []).concat(hasClients() ? [["clients","Clients"]] : []);
  var h = '<div class="tabs">' + tabs.map(function(t){ return '<button type="button" data-tab="' + t[0] + '" class="' + (ui.tab===t[0]?"on":"") + '">' + t[1] + '</button>'; }).join("") + '</div>';
  if(ui.tab === "timeline") h += viewTimeline();
  else if(ui.tab === "clients") h += viewClients();
  else h += viewProjects();
  root.innerHTML = h; bind();
}

function shownProjects(){
  var qq = ui.search.trim().toLowerCase();
  return projects().filter(function(p){
    if(ui.status === "active" && (p.status === "complete")) return false;
    if(ui.status !== "active" && ui.status !== "all" && p.status !== ui.status) return false;
    return !qq || [p.jobNo, p.name, clientName(p.clientId), p.site && p.site.address].join(" ").toLowerCase().indexOf(qq) >= 0; });
}
function viewProjects(){
  var all = projects(), shown = shownProjects();
  var h = '<div class="row" style="margin:12px 0;justify-content:space-between">' + (canEdit() ? '<button class="btn btn-primary" id="newJob">＋ New job</button>' : '<span></span>') + '<div class="row">' + (user && core.isMainRoot(user) ? '<button class="btn" id="impXl" title="Bring in jobs from your project schedule spreadsheet">📥 Import from Excel</button><input type="file" id="impFile" accept=".xlsx,.xlsm,.xls" class="hide">' : '') + '<button class="btn" id="prList">🖨 Print job list</button></div></div>';
  h += '<div class="card"><div class="seg" style="margin-bottom:10px">' + [["active","Active"]].concat(STATUS).concat([["all","All"]]).map(function(s){ return '<button type="button" data-status="' + s[0] + '" class="' + (ui.status===s[0]?"on":"") + '">' + s[1] + '</button>'; }).join("") + '</div>' +
    '<input id="search" placeholder="Search job no., name, client or site…" value="' + esc(ui.search) + '" style="margin-bottom:12px">';
  if(!shown.length) h += '<div class="empty">' + (all.length ? "No jobs match." : (canEdit() ? "No jobs yet — tap “New job”." : "No jobs yet.")) + '</div>';
  else h += '<div class="pjlist">' + shown.map(function(p){ var sp = projectSpan(p), pr = progress(p), nd = drawings(p).length;
    return '<div class="pj st-' + esc(p.status || "planning") + '" data-open="' + esc(p.id) + '"><div class="h"><b>' + esc(pLabel(p)) + '</b>' + statusPill(p.status) + '</div>' +
      '<div class="small muted">' + [clientName(p.clientId) ? "👤 " + esc(clientName(p.clientId)) : "", p.site && p.site.address ? "📍 " + esc(p.site.address) : "", nd + " drawing" + (nd===1?"":"s"), sp.s ? fmtD(sp.s) + " → " + fmtD(sp.e) : "", p.due ? "due " + fmtD(p.due) : ""].filter(Boolean).join(" · ") + '</div>' +
      (pr ? '<div class="prog"><i style="width:' + pr + '%"></i></div>' : '') + '</div>'; }).join("") + '</div>';

}

// ---- timeline (Gantt) ----
function mondayOf(d){ var x = new Date(d + "T00:00:00"); var w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return x; }
function iso(d){ var x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function viewTimeline(){
  var DAYS = 84, W = 18;

  var start = new Date(ui.tlStart + "T00:00:00"), end = addDays(start, DAYS), t0 = today();
  var dayIdx = function(s){ return Math.round((new Date(s + "T00:00:00") - start) / 86400000); };
  var bar = function(s, e, color, title, extra){ if(!s && !e) return ""; s = s || e; e = e || s; var a = Math.max(0, dayIdx(s)), b = Math.min(DAYS - 1, dayIdx(e)); if(b < 0 || a > DAYS - 1) return "";
    return '<i class="bar" title="' + esc(title) + '" style="' + (extra || "") + 'left:' + (a * W + 1) + 'px;width:' + Math.max(W - 2, (b - a + 1) * W - 2) + 'px;background:' + color + '"></i>'; };

  var ti = dayIdx(t0), todayCol = ti >= 0 && ti < DAYS ? '<i style="position:absolute;top:0;bottom:0;left:' + (ti * W) + 'px;width:' + W + 'px;background:rgba(224,163,58,.12)"></i>' : '';
  var rows = '';
  var ps = projects().filter(function(p){ return p.status !== "complete" || ui.tlAll; });
  ps.forEach(function(p){ var sp = projectSpan(p), open = !!ui.open[p.id];
    var lanes = hasPlan(p) ? PLAN_LANES.map(function(x, i){ var v = p.plan[x.k]; return v && (v.start || v.end) ? bar(v.start, v.end, x.c, x.t + ": " + fmtD(v.start) + " → " + fmtD(v.end), "top:" + (3 + i * 6) + "px;height:5px;") : ""; }).join("") : "";
    rows += '<div class="gl p" data-toggle="' + esc(p.id) + '"' + (hasPlan(p) ? ' style="min-height:36px"' : '') + '>' + (open ? "▾ " : "▸ ") + esc(pLabel(p)) + '</div><div class="gc"' + (hasPlan(p) ? ' style="min-height:36px"' : '') + '>' + todayCol + (hasPlan(p) ? lanes : bar(sp.s, sp.e, "#3E6A8A", pLabel(p) + ": " + fmtD(sp.s) + " → " + fmtD(sp.e))) +
      (p.due && dayIdx(p.due) >= 0 && dayIdx(p.due) < DAYS ? '<i title="Due ' + esc(fmtD(p.due)) + '" style="position:absolute;top:3px;bottom:3px;left:' + (dayIdx(p.due) * W + W / 2 - 1) + 'px;width:2px;background:#E39A80"></i>' : '') + '</div>';

      rows += '<div class="gl a" title="' + esc((d.no || "") + " " + a.name) + '">' + esc((d.no ? d.no + " · " : "") + a.name) + '</div><div class="gc">' + todayCol +
        STAGES.map(function(st){ var x = a.stages && a.stages[st.k]; return x && !x.skip ? bar(x.start, x.end, x.done ? "#4F7A45" : st.c, st.t + ": " + fmtD(x.start) + " → " + fmtD(x.end) + (x.done ? " ✓ done" : x.prog === "doing" ? " — in progress" : ""), !x.done && x.prog === "doing" ? "outline:2px dashed #F3D08A;outline-offset:-1px;" : "") : ""; }).join("") + '</div>'; }); });
  });
  return '<div class="row" style="margin:12px 0;justify-content:space-between"><div class="row"><button class="btn btn-sm" id="tlPrev">◀ 4 weeks</button><button class="btn btn-sm" id="tlToday">This week</button><button class="btn btn-sm" id="tlNext">4 weeks ▶</button><button class="btn btn-sm" id="prTl">🖨 Print</button></div>' +
    '<label class="small" style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="tlAll" style="width:auto"' + (ui.tlAll ? " checked" : "") + '> show completed jobs</label></div>' +
    '<div class="legend"><span><i class="stg" style="background:#3E6A8A"></i>Job</span><span><i class="stg" style="background:#8C8CB8"></i>Design</span>' + STAGES.map(function(s){ return '<span><i class="stg" style="background:' + s.c + '"></i>' + s.t + '</span>'; }).join("") + '<span><i class="stg" style="background:#4F7A45"></i>Done</span><span><i class="stg" style="background:#E39A80"></i>Due date</span></div>' +
    (ps.length ? '<div class="gantt"><div class="g" style="' + cols + '"><div class="gh" style="position:sticky;left:0;z-index:2;text-align:left;padding-left:8px">Job — tap to open the breakdown</div><div class="gh" style="position:relative;height:18px">' + weeks + '</div>' + rows + '</div></div>' +
      '<p class="small muted">Each job shows its programme (design → cutting → edging → manufacturing → install); jobs without one show their drawing-breakdown dates. Tap a job to see its items.</p>' : '<div class="empty">No jobs yet.</div>');
}

// ---- one job ----
function viewProject(p){

async function returnMat(p, m){
  if(!freshUser() || !canMat()) return;
  if(!confirm(m.stock ? "Put " + m.qty + " " + (m.unit || "") + " × " + m.item + " back into stock at " + m.location + "?" : "Remove this record?")) return;
  try{
    if(m.stock && m.stock.app === "board"){
      var res = await db.ref("boardStock").transaction(function(cur){
        if(!cur) return; cur.boards = arr(cur.boards); cur.log = arr(cur.log);
        var b = cur.boards.find(function(x){ return x.code === m.stock.code; }); if(!b) return;
        if(typeof b.qty !== "object" || !b.qty) b.qty = {};
        b.qty[m.location] = r3((Number(b.qty[m.location]) || 0) + num(m.qty));
        var total = r3(Object.keys(b.qty).reduce(function(a2, k){ return a2 + (Number(b.qty[k]) || 0); }, 0));
        b.reorderNotified = total <= (Number(b.reorderLevel) || 0);
        cur.log.unshift({ id:uid(), ts:new Date().toISOString(), user:user.username, boardCode:b.code, action:"add", qtyChange:num(m.qty), resultingQty:total, reason:"Returned from job " + pLabel(p) + " (" + m.location + ")" });
        return cur; });
      if(!res.committed) throw new Error("Board Stock didn't update");
    } else if(m.stock && m.stock.app === "cons"){
      var parts = m.stock.id.split(":"), kind = parts[0], rid = parts.slice(1).join(":"), base = "consumablesStock/", qty = num(m.qty);
      if(kind === "s") await db.ref(base + "screwItems/" + rid + "/qtyByLocation/" + fbKey(m.location)).transaction(function(v){ return r3((Number(v) || 0) + qty); });
      else if(kind === "l") await db.ref(base + "consumableTypes/" + rid + "/volumeByLocation/" + fbKey(m.location)).transaction(function(v){ return (Number(v) || 0) + Math.round(qty * 1000); });
      else { var upd = {}, dd = today(); for(var k = 0; k < Math.round(qty); k++) upd[uid() + k] = { typeId:rid, fillLevel:"Full", createdDate:dd, location:m.location }; await db.ref(base + "consumableUnits").update(upd); }
    }
    if(m.stock) await db.ref("projects/materials/" + p.id + "/" + m.id + "/returned").set({ ts:new Date().toISOString(), by:user.username });
    else await db.ref("projects/materials/" + p.id + "/" + m.id).remove();
    toast(m.stock ? "Back in stock." : "Removed.", "ok"); render();
  }catch(e){ toast("Couldn't do that: " + (e.message || e), "err"); }
}

function printTimelineHtml(asm){
  var DAYS = 84, start = new Date(ui.tlStart + "T00:00:00"), end = addDays(start, DAYS - 1);
  var pct = function(i){ return (i / DAYS * 100).toFixed(3) + "%"; };
  var di = function(s){ return Math.round((new Date(s + "T00:00:00") - start) / 86400000); };
  var bar = function(s, e, color){ if(!s && !e) return ""; s = s || e; e = e || s; var a = Math.max(0, di(s)), b = Math.min(DAYS - 1, di(e)); if(b < 0 || a > DAYS - 1) return "";
    return '<i class="gb" style="left:' + pct(a) + ';width:calc(' + pct(b - a + 1) + ' - 1px);background:' + color + '"></i>'; };
  var grid = ''; for(var w = 0; w < DAYS / 7; w++) grid += '<i class="gw" style="left:' + pct(w * 7) + '"></i>';
  var ti = di(today()), tcol = ti >= 0 && ti < DAYS ? '<i class="gt" style="left:' + pct(ti) + ';width:' + pct(1) + '"></i>' : '';
  var weeks = ''; for(var k = 0; k < DAYS / 7; k++) weeks += '<span style="left:' + pct(k * 7) + '">' + esc(dShort(iso(addDays(start, k * 7)))) + '</span>';
  var rows = '';
  projects().filter(function(p){ return p.status !== "complete" || ui.tlAll; }).forEach(function(p){ var sp = projectSpan(p);
    var pl = hasPlan(p) ? PLAN_LANES.map(function(x, i){ var v = p.plan[x.k]; return v && (v.start || v.end) ? bar(v.start, v.end, x.c).replace('class="gb" style="', 'class="gb" style="top:' + (2 + i * 4) + 'px;height:3.5px;') : ""; }).join("") : "";
    rows += '<tr class="gj"><td>' + esc(pLabel(p)) + (clientName(p.clientId) ? '<div class="pm">' + esc(clientName(p.clientId)) + '</div>' : '') + '</td><td class="gc"' + (hasPlan(p) ? ' style="height:24px"' : '') + '>' + grid + tcol + (hasPlan(p) ? pl : bar(sp.s, sp.e, "#3E6A8A")) +
      (p.due && di(p.due) >= 0 && di(p.due) < DAYS ? '<i class="gd" style="left:' + pct(di(p.due) + 0.5) + '"></i>' : '') + '</td></tr>';
    if(asm) drawings(p).forEach(function(d){ assemblies(d).forEach(function(a){
      rows += '<tr><td class="ga">' + esc((d.no ? d.no + " · " : "") + a.name) + '</td><td class="gc">' + grid + tcol + STAGES.map(function(st){ var x = a.stages && a.stages[st.k]; return x ? bar(x.start, x.end, x.done ? "#4F7A45" : st.c) : ""; }).join("") + '</td></tr>'; }); });
  });
  var legend = '<div class="pl"><span><i style="background:#3E6A8A"></i>Job</span><span><i style="background:#8C8CB8"></i>Design</span>' + STAGES.map(function(s){ return '<span><i style="background:' + s.c + '"></i>' + esc(s.t) + '</span>'; }).join("") + '<span><i style="background:#4F7A45"></i>Done</span><span><i style="background:#D0603F;width:3px"></i>Due date</span></div>';
  return prHead("Production timeline", esc(fmtD(iso(start))) + " → " + esc(fmtD(iso(end)))) + legend +
    (rows ? '<table class="gtab"><thead><tr><th>Job</th><th class="gh">' + weeks + '</th></tr></thead><tbody>' + rows + '</tbody></table>' : '<p class="pm">No jobs.</p>');
}

// ---------- start ----------
var started = false;
function start(){
  if(started) return; started = true;
  db = firebase.database();
  // don't redraw under someone typing in a form or a date box
  var rr = function(){ var a = document.activeElement; if(busy || !document.getElementById("modal").classList.contains("hide") || (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && a.id !== "search")){ render.pending = true; return; } render(); };
  document.addEventListener("focusout", function(){ setTimeout(function(){ if(render.pending && document.getElementById("modal").classList.contains("hide")){ var a = document.activeElement; if(!(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))){ render.pending = false; render(); } } }, 50); });
  // every job / drawing / assembly / client / material carries its own key as .id
  var ids = function(o){ if(o && typeof o === "object") Object.keys(o).forEach(function(k){ if(o[k] && typeof o[k] === "object") o[k].id = k; }); return o || {}; };
  db.ref("projects/list").on("value", function(s){ D.projects = ids(s.val()); Object.keys(D.projects).forEach(function(k){ var pp = D.projects[k]; ids(pp.drawings); Object.keys(pp.drawings || {}).forEach(function(dk){ ids(pp.drawings[dk] && pp.drawings[dk].assemblies); }); }); rr(); });
  db.ref("projects/materials").on("value", function(s){ D.materials = ids(s.val()); Object.keys(D.materials).forEach(function(k){ ids(D.materials[k]); }); rr(); });
  db.ref("clients/list").on("value", function(s){ D.clients = ids(s.val()); rr(); });
  db.ref("boardStock").on("value", function(s){ D.board = s.val() || {}; });
  ["screwItems","consumableTypes","meta"].forEach(function(k){ db.ref("consumablesStock/" + k).on("value", function(s){ D.cons[{ screwItems:"items", consumableTypes:"types", meta:"meta" }[k]] = s.val() || {}; }); });
  db.ref("dispatchBoard/notes").on("value", function(s){ D.notes = arr(s.val()); if(ui.ptab === "deliveries" || ui.view === "client") rr(); });
  db.ref("orders/list").on("value", function(s){ D.orders = s.val() || {}; if(ui.ptab === "deliveries" || ui.view === "client") rr(); });
  render();
}
try{
  core.init();
  core.startUsersSync(function(users){
    var r = S.resolve(users);
    if(r.status === "wait") return;
    if(r.status !== "ok"){ S.goHome({ next:"projects" }); return; }
    user = r.user; document.getElementById("who").textContent = user.username;
    start(); render();
  });
}catch(e){ document.getElementById("app").innerHTML = '<div class="card"><h2>Could not start</h2><p class="muted">' + esc(e.message || String(e)) + '</p></div>'; }
if(!S.get()) S.goHome({ next:"projects" });
})();
</script>
<script>
/* Oak Joinery — shared "← Back" button (2026-09-30, per Sean: "let's put back
   buttons in all apps"). Adds a Back button next to every "☰ Menu" button and
   makes the phone's own back button do the same thing. Back goes, in order:
     1. out of an open pop-up (a delivery note opened from the list goes back
        to the list),
     2. to the previous screen in the app (Orders / Tools detail pages, or the
        last tab you were on),
     3. to the Oak Joinery menu.
   Apps can tell it about their tabs with window.OAK_BACK_TABS = { get, set }. */
(function(){
  "use strict";
  if (window.__oakBack) return; window.__oakBack = true;
  var tabStack = [], lastTab = null, goingBack = false;

  function visible(el){
    if (!el || !el.isConnected) return false;
    var cs = getComputedStyle(el);
    if (cs.display === "none" || cs.visibility === "hidden") return false;
    var r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }
  var OVERLAYS = "#noteBg, #allBg, .modal-bg, .modal-overlay, .mbg, #modal-root .modal-backdrop, #modal-root > div";
  function topOverlay(){
    var list = Array.prototype.slice.call(document.querySelectorAll(OVERLAYS)).filter(visible)
      .filter(function(el){ return el.id !== "loginOverlay" && !el.closest("#loginOverlay") && !/login/i.test(el.id || ""); });
    return list.length ? list[list.length - 1] : null;
  }
  function closeButtonIn(el){
    var b = el.querySelector(".note-back");
    if (b && visible(b)) return b;
    var btns = Array.prototype.slice.call(el.querySelectorAll("button")).filter(visible);
    return btns.find(function(x){ return /(^|\s)(close-x|modal-close)(\s|$)/.test(x.className) || x.id === "mCancel" || x.id === "modal-cancel"; }) ||
           btns.find(function(x){ return /^\s*(cancel|close|done|back|×|✕)\s*$/i.test(x.textContent); }) || null;
  }
  function goMenu(){
    try { if (window.OakCore && OakCore.session && OakCore.session.get()) { OakCore.session.goHome(); return; } } catch (e) {}
    location.href = "https://seanoakjoinery.github.io/oak-core/";
  }
  function back(){
    var ov = topOverlay();
    if (ov){
      var b = closeButtonIn(ov);
      if (b){ b.click(); return true; }
      if (typeof window.closeModal === "function"){ window.closeModal(); return true; }
      ov.remove(); return true;
    }
    var link = Array.prototype.slice.call(document.querySelectorAll(".backlink#back, #back.backlink")).filter(visible)[0];
    if (link){ link.click(); return true; }
    var T = window.OAK_BACK_TABS;
    if (T && tabStack.length){
      goingBack = true;
      var t = tabStack.pop(); lastTab = t;
      try { T.set(t); } finally { goingBack = false; }
      return true;
    }
    goMenu(); return false;
  }
  window.oakBack = back;

  // Remember the tab you came from.
  function trackTab(){
    var T = window.OAK_BACK_TABS; if (!T) return;
    var cur; try { cur = T.get(); } catch (e) { return; }
    if (cur === undefined || cur === null) return;
    if (lastTab !== null && cur !== lastTab && !goingBack){ tabStack.push(lastTab); if (tabStack.length > 30) tabStack.shift(); }
    lastTab = cur;
  }

  // Put a Back button in front of every Menu button (apps redraw, so keep checking).
  function addButtons(){
    var menus = Array.prototype.slice.call(document.querySelectorAll("button, a")).filter(function(x){
      return /☰\s*Menu/.test(x.textContent || "") && !x.dataset.oakBackDone;
    });
    menus.forEach(function(m){
      m.dataset.oakBackDone = "1";
      var b = document.createElement(m.tagName === "A" ? "button" : m.tagName);
      b.type = "button";
      b.className = m.className;
      b.setAttribute("style", (m.getAttribute("style") || "") + ";margin-right:6px");
      b.textContent = "← Back";
      b.title = "Back to the previous screen";
      b.addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); back(); });
      m.parentNode.insertBefore(b, m);
    });
  }
  function tick(){ addButtons(); trackTab(); }
  new MutationObserver(tick).observe(document.documentElement, { childList:true, subtree:true });
  document.addEventListener("click", function(){ setTimeout(trackTab, 0); }, true);
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tick); else tick();

  // The phone's own back button does the same as the Back button.
  try {
    history.pushState({ oakBack:1 }, "");
    window.addEventListener("popstate", function(){
      var stay = back();
      if (stay) history.pushState({ oakBack:1 }, "");
    });
  } catch (e) {}
})();
</script>
